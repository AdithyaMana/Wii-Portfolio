<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Survey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1408;
        }

        .channel-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            animation: channel-fade-in 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        @keyframes channel-fade-in {
            0% {
                opacity: 0;
                transform: scale(1.02);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .channel-bg {
            width: 100%;
            height: 100%;
            background-image: url('channel.jpg');
            background-size: 102%;
            background-position: center;
            background-repeat: no-repeat;
            animation: wii-float 12s ease-in-out infinite;
        }

        @keyframes wii-float {

            0%,
            100% {
                background-size: 102%;
                background-position: center;
            }

            50% {
                background-size: 105%;
                background-position: 49% 51%;
            }
        }

        /* BRIGHT sparkle particles */
        .sparkle {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 230, 130, 1) 25%, rgba(255, 200, 80, 0.9) 50%, transparent 80%);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 230, 130, 1), 0 0 40px rgba(255, 200, 80, 1), 0 0 60px rgba(255, 180, 40, 0.8), 0 0 80px rgba(255, 150, 0, 0.5);
            animation: sparkle-float 3s ease-in-out infinite;
        }

        .sparkle.small {
            width: 10px;
            height: 10px;
        }

        .sparkle.medium {
            width: 16px;
            height: 16px;
        }

        .sparkle.large {
            width: 22px;
            height: 22px;
        }

        .sparkle:nth-child(2) {
            left: 10%;
            top: 20%;
            animation-delay: 0.2s;
            animation-duration: 2.5s;
        }

        .sparkle:nth-child(3) {
            left: 20%;
            top: 40%;
            animation-delay: 0.5s;
            animation-duration: 3.5s;
        }

        .sparkle:nth-child(4) {
            left: 30%;
            top: 60%;
            animation-delay: 0.8s;
            animation-duration: 2.8s;
        }

        .sparkle:nth-child(5) {
            left: 40%;
            top: 25%;
            animation-delay: 1s;
            animation-duration: 3.2s;
        }

        .sparkle:nth-child(6) {
            left: 50%;
            top: 50%;
            animation-delay: 0.3s;
            animation-duration: 2.6s;
        }

        .sparkle:nth-child(7) {
            left: 60%;
            top: 35%;
            animation-delay: 0.7s;
            animation-duration: 3s;
        }

        .sparkle:nth-child(8) {
            left: 70%;
            top: 65%;
            animation-delay: 1.2s;
            animation-duration: 2.4s;
        }

        .sparkle:nth-child(9) {
            left: 80%;
            top: 30%;
            animation-delay: 0.4s;
            animation-duration: 3.3s;
        }

        .sparkle:nth-child(10) {
            left: 85%;
            top: 55%;
            animation-delay: 0.9s;
            animation-duration: 2.7s;
        }

        .sparkle:nth-child(11) {
            left: 15%;
            top: 70%;
            animation-delay: 1.5s;
            animation-duration: 3.1s;
        }

        .sparkle:nth-child(12) {
            left: 25%;
            top: 15%;
            animation-delay: 0.6s;
            animation-duration: 2.9s;
        }

        .sparkle:nth-child(13) {
            left: 55%;
            top: 75%;
            animation-delay: 1.1s;
            animation-duration: 2.5s;
        }

        .sparkle:nth-child(14) {
            left: 75%;
            top: 18%;
            animation-delay: 0.1s;
            animation-duration: 3.4s;
        }

        .sparkle:nth-child(15) {
            left: 90%;
            top: 45%;
            animation-delay: 1.3s;
            animation-duration: 2.8s;
        }

        @keyframes sparkle-float {

            0%,
            100% {
                opacity: 0;
                transform: scale(0.4) rotate(0deg);
            }

            25% {
                opacity: 0.9;
                transform: scale(1.1) rotate(90deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.5) rotate(180deg);
            }

            75% {
                opacity: 0.9;
                transform: scale(1.1) rotate(270deg);
            }
        }

        /* INTENSE gold glow overlay */
        .glow-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 45%, rgba(255, 200, 80, 0.25) 0%, transparent 50%);
            animation: glow-pulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glow-pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="channel-container">
        <div class="channel-bg"></div>
        <div class="glow-overlay"></div>
        <div class="sparkle small"></div>
        <div class="sparkle large"></div>
        <div class="sparkle medium"></div>
        <div class="sparkle small"></div>
        <div class="sparkle large"></div>
        <div class="sparkle medium"></div>
        <div class="sparkle small"></div>
        <div class="sparkle large"></div>
        <div class="sparkle medium"></div>
        <div class="sparkle small"></div>
        <div class="sparkle large"></div>
        <div class="sparkle medium"></div>
        <div class="sparkle small"></div>
        <div class="sparkle large"></div>
    </div>
</body>

</html>
