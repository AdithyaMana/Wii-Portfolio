<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterPoster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #a3dfb2;
        }

        .channel-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 74% 42%, #fffbe6 0%, #e8f8d8 28%, #a3dfb2 70%, #5cba7e 100%);
            animation: channel-fade-in 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        @keyframes channel-fade-in {
            0% {
                opacity: 0;
                transform: scale(1.02);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Sunburst turning slowly behind the poster */
        .rays {
            position: absolute;
            left: 74%;
            top: 42%;
            width: 300vmax;
            height: 300vmax;
            margin: -150vmax 0 0 -150vmax;
            background: repeating-conic-gradient(rgba(255, 255, 255, 0.3) 0deg 7deg, transparent 7deg 14deg);
            animation: spin 60s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Halftone dots in the corners */
        .dots {
            background-image: radial-gradient(#1d9a55 28%, transparent 32%);
            background-size: 2.2vw 2.2vw;
            opacity: 0.12;
            -webkit-mask-image: radial-gradient(circle at 70% 45%, transparent 40%, #000 85%);
            mask-image: radial-gradient(circle at 70% 45%, transparent 40%, #000 85%);
        }

        .art {
            background: url('channel.webp') center / cover no-repeat;
            transform-origin: 50% 100%;
            animation: breathe 7s ease-in-out infinite;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.025);
            }
        }

        .shine {
            -webkit-mask: url('channel.webp') center / cover no-repeat;
            mask: url('channel.webp') center / cover no-repeat;
            transform-origin: 50% 100%;
            animation: breathe 7s ease-in-out infinite;
        }

        .shine::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.6) 50%, transparent 60%);
            background-size: 250% 100%;
            animation: sweep 6s ease-in-out infinite;
            animation-delay: 1.5s;
        }

        @keyframes sweep {
            0% {
                background-position: 130% 0;
            }

            45%,
            100% {
                background-position: -30% 0;
            }
        }

        /* Confetti drifting down */
        .confetti {
            position: absolute;
            top: -6%;
            width: 1.6%;
            height: 0.8%;
            min-width: 5px;
            min-height: 3px;
            border-radius: 2px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(80vh) rotate(540deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            width: 3%;
            aspect-ratio: 1;
            background: #fff;
            clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
            animation: sparkle 2.8s ease-in-out infinite;
        }

        @keyframes sparkle {

            0%,
            100% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            50% {
                transform: scale(1) rotate(45deg);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="channel-container">
        <div class="rays"></div>
        <div class="layer dots"></div>
        <div class="layer">
            <div class="confetti" style="left: 8%; background: #ffd23f; animation-duration: 7s;"></div>
            <div class="confetti" style="left: 22%; background: #ff8a5b; animation-duration: 9s; animation-delay: 2s;"></div>
            <div class="confetti" style="left: 41%; background: #6fcaf2; animation-duration: 8s; animation-delay: 4s;"></div>
            <div class="confetti" style="left: 55%; background: #1d9a55; animation-duration: 10s; animation-delay: 1s;"></div>
            <div class="confetti" style="left: 64%; background: #ffd23f; animation-duration: 7.5s; animation-delay: 5s;"></div>
            <div class="confetti" style="left: 90%; background: #ff8a5b; animation-duration: 8.5s; animation-delay: 3s;"></div>
        </div>
        <div class="layer art"></div>
        <div class="layer shine"></div>
        <div class="layer">
            <div class="sparkle" style="top: 10%; left: 5%;"></div>
            <div class="sparkle" style="top: 8%; left: 48%; width: 2.2%; animation-delay: 1.1s;"></div>
            <div class="sparkle" style="top: 44%; left: 96%; width: 2.2%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="top: 74%; left: 50%; width: 2%; animation-delay: 1.8s;"></div>
        </div>
    </div>
</body>

</html>
