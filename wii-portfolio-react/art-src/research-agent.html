<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Research Agent 3D art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="studio.js"></script>
    <script>
        // A library card catalogue, rendered in 3D like a Wii channel banner:
        // an oak cabinet of drawers on a pale studio backdrop, with the N-R
        // drawer pulled out. A ripple runs through its cards as they are read,
        // one by one, until the right one pops up with a blue flag on it and
        // its title highlighted, then settles back for the next search.
        //
        // The typed cards and labels are real text, set in Courier Prime on a
        // canvas the shader reads as a texture. studio.js does the rest: the
        // marching, lighting, camera, frame loop and title.
        const FRAMES = 40, DELAY = 75;

        const VIEW = viewFrom(TALL ? {
            eye: [2.9, 3.5, 6.4], target: [0.55, 1.0, 1.4], zoom: 1.8, shift: [0.0, -0.17],
        } : {
            eye: [2.9, 3.1, 5.9], target: [0.75, 1.1, 1.5], zoom: 2.45, shift: [0.42, -0.06],
        });

        // ---- the cards and labels, typed onto a canvas the shader samples.
        // Each entry is a rectangle of the atlas, in pixels.
        const ATLAS = 2048;
        const REGION = {
            pick: [8, 8, 1024, 596],
            cards: [[1048, 8, 492, 286], [1548, 8, 492, 286], [1048, 302, 492, 286], [1548, 302, 492, 286]],
            labels: [0, 1, 2, 3, 4, 5].map(i => [8 + (i % 3) * 336, 620 + Math.floor(i / 3) * 120, 320, 106]),
            tabs: [0, 1, 2, 3, 4].map(i => [1048 + i * 196, 620, 180, 96]),
        };
        // the found card: a catalogue entry for the case study itself
        const PICK_CARD = {
            call: ['Q', '336', '.M36'],
            lines: [
                [0, 'Mana, Adithya.'],
                [1, 'Research agent : a case study / by'],
                [0, 'Adithya Mana. -- Wii ed.'],
                [1, '1 v. : ill., col. ; 16 x 9 in.'],
                null,
                [1, '1. Artificial intelligence.  2. Infor-'],
                [0, 'mation retrieval.  3. User experience'],
                [0, 'design.  I. Title.'],
            ],
            highlight: 1,
        };
        // the cards around it, other books filed under N to R
        const OTHER_CARDS = [
            { call: ['Z', '699', '.S43'], lines: [[0, 'Online searching.'], [1, 'Searching for sources : a field'], [0, 'guide. -- 2nd ed.'], [1, 'xii, 214 p. ; 23 cm.']] },
            { call: ['LB', '1050', '.45'], lines: [[0, 'Reading comprehension.'], [1, 'How we read : notes on attention'], [0, 'and memory.'], [1, '180 p. : ill. ; 21 cm.']] },
            { call: ['Z', '1040', '.N68'], lines: [[0, 'Note-taking -- Methodology.'], [1, 'Cards, notes and indexes / with'], [0, 'a foreword. -- 1st ed.'], [1, '96 p. ; 19 cm.']] },
            { call: ['BC', '177', '.Q47'], lines: [[0, 'Questioning.'], [1, 'The art of asking : a short'], [0, 'course in inquiry.'], [1, 'xv, 240 p. ; 22 cm.']] },
        ];
        // drawers left to right, top row first; the open one is top right
        const LABELS = ['A – F', 'G – M', 'N – R', 'S', 'T – V', 'W – Z'];
        // guide cards in the open drawer: index of the card and its letter
        const GUIDES = [[0, 'N'], [3, 'O'], [6, 'P'], [8, 'Q'], [10, 'R']];

        function typeCard(ctx, [x, y, w, h], card, rand) {
            const k = w / 1024, INK = '#14151c';
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(k, k);
            const typeLine = (str, tx, ty) => {
                // a typewriter: every letter struck a little differently
                for (const ch of str) {
                    ctx.globalAlpha = 0.86 + rand() * 0.14;
                    ctx.fillText(ch, tx, ty + (rand() - 0.5) * 1.6);
                    tx += 20.4;
                }
                ctx.globalAlpha = 1;
            };
            ctx.font = 'bold 34px "Courier Prime"';
            ctx.textBaseline = 'alphabetic';
            const row = i => 112 + i * 54;
            if (card.highlight !== undefined) {
                const i = card.highlight, str = card.lines[i][1];
                ctx.fillStyle = 'rgba(255, 206, 0, 0.85)';
                ctx.beginPath();
                ctx.moveTo(214, row(i) - 30);
                ctx.lineTo(236 + str.length * 20.4, row(i) - 33);
                ctx.lineTo(240 + str.length * 20.4, row(i) + 11);
                ctx.lineTo(210, row(i) + 13);
                ctx.fill();
            }
            ctx.fillStyle = INK;
            card.call.forEach((c, i) => typeLine(c, 56, row(i)));
            card.lines.forEach((l, i) => l && typeLine(l[1], 236 + l[0] * 61, row(i)));
            ctx.restore();
        }

        function makeAtlas() {
            const c = document.createElement('canvas');
            c.width = c.height = ATLAS;
            const ctx = c.getContext('2d');
            const rand = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(7);
            typeCard(ctx, REGION.pick, PICK_CARD, rand);
            OTHER_CARDS.forEach((card, i) => typeCard(ctx, REGION.cards[i], card, rand));
            ctx.fillStyle = '#20222c';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            REGION.labels.forEach(([x, y, w, h], i) => {
                ctx.font = 'bold 58px "Courier Prime"';
                ctx.fillText(LABELS[i], x + w / 2, y + h / 2 + 3);
            });
            REGION.tabs.forEach(([x, y, w, h], i) => {
                ctx.font = 'bold 64px "Courier Prime"';
                ctx.fillText(GUIDES[i][1], x + w / 2, y + h / 2 + 2);
            });
            return c;
        }

        // The open drawer (top right), how far out it is, and its cards; the
        // shader is written with these too
        const FRONT = 1.3, PULL = 1.62, OPEN = [1.06, 1.28], NCARDS = 26, PICK = 12;

        // ---- the animation, frame f of the loop: a ripple runs through the
        // cards as they are read one after another, the found card rises and
        // holds, then settles back. Every card's hop and the found card's rise.
        function pose(f) {
            const t = f / FRAMES;
            const hops = Array.from({ length: PICK }, (_, i) => 0.085 * Math.sin(Math.PI * Math.min(1, Math.max(0, (t - 0.03 - i * 0.022) / 0.085))) ** 2);
            const rise = easeBack((t - 0.03 - PICK * 0.022) / 0.14) * (1 - ease((t - 0.86) / 0.12));
            return { hops, rise };
        }

        const HEAD = `
uniform float uHop[${PICK}];
uniform float uRise;

`;

        const GEOMETRY = `
// ---- the cabinet: three drawers across, two high, in an oak carcass
const vec2 CELL = vec2(1.06, 0.68);
const float PLINTH = 0.2;
const vec3 BODY = vec3(1.66, 0.74, 1.3);    // half size of the carcass
const float FRONT = ${FRONT.toFixed(2)};       // z of its face
const float YC = PLINTH + 0.74;             // height of its middle
const vec2 FACE = vec2(0.49, 0.3);          // half size of a drawer front
const float PULL = ${PULL.toFixed(2)};        // how far the open drawer is out
const vec2 OPEN = vec2(${OPEN.map(v => v.toFixed(2)).join(', ')}); // the open drawer: top right

// ---- its cards
const int NCARDS = ${NCARDS};
const float SP = 0.068;
const int PICK = ${PICK};             // the card the search finds
const float FLOORY = -0.255;                // the drawer's inside floor
const vec2 CARD = vec2(0.405, 0.235);       // half size of a card
const float GUIDE_UP = 0.02;                // guide cards stand this much taller
const float TOPMAX = 0.42;                  // above this only the found card goes

const float M_FLOOR = 0.0, M_WOOD = 1.0, M_BRASS = 2.0, M_LABEL = 3.0, M_CARD = 4.0, M_GUIDE = 5.0, M_TAB = 6.0, M_FLAG = 7.0;
const float M_CLOTH = 8.0, M_PAGES = 9.0, M_PAINT = 10.0, M_LEAD = 11.0, M_ERASER = 12.0, M_CEDAR = 13.0;
const float TOP = YC + BODY.y + 0.09;       // the cabinet's top surface

// ---- the animation, worked out in JS: each card's hop, the found card's rise
float hopOf(int i) { return i < PICK ? uHop[i] : 0.0; }
float rise() { return uRise; }

int guideAt(int i) {
    ${GUIDES.map(([i], k) => `if (i == ${i}) return ${k};`).join('\n    ')}
    return -1;
}
float tabX(int g) { return (float(g % 3) - 1.0) * 0.27; }

// ---- a drawer front, centred on it at the carcass face
vec2 drawerFront(vec3 l) {
    vec2 r = vec2(sdRBox(l - vec3(0.0, 0.0, 0.022), vec3(FACE, 0.022), 0.018), M_WOOD);
    // a low raised field
    r.x = smin(r.x, sdRBox(l - vec3(0.0, 0.0, 0.046), vec3(FACE - 0.05, 0.008), 0.008), 0.012);
    // the brass label holder and its card
    vec3 h = l - vec3(0.0, 0.1, 0.056);
    float frame = max(sdRBox(h, vec3(0.17, 0.066, 0.006), 0.004), -sdBox(h - vec3(0.0, 0.0, 0.004), vec3(0.15, 0.048, 0.008)));
    r = U(r, vec2(frame, M_BRASS));
    r = U(r, vec2(sdBox(h + vec3(0.0, 0.0, 0.002), vec3(0.152, 0.05, 0.002)), M_LABEL));
    // a round brass knob
    vec3 k = l - vec3(0.0, -0.105, 0.0);
    r = U(r, vec2(smin(length(k - vec3(0.0, 0.0, 0.118)) - 0.048, sdCapsule(k, vec3(0.0, 0.0, 0.05), vec3(0.0, 0.0, 0.1), 0.02), 0.02), M_BRASS));
    return r;
}

// the closed drawers' grid cell: column 0-2 left to right, row 0 bottom, 1 top
vec2 cellOf(vec2 q) { return clamp(floor(q / CELL + vec2(1.5, 1.0)), vec2(0.0), vec2(2.0, 1.0)); }
vec2 cellCentre(vec2 id) { return (id - vec2(1.0, 0.5)) * CELL; }

vec2 closedFronts(vec3 p) {
    vec3 q = p - vec3(0.0, YC, FRONT);
    float bound = sdBox(q - vec3(0.0, 0.0, 0.08), vec3(CELL.x * 1.5, CELL.y, 0.1));
    if (bound > 0.35) return vec2(bound, M_WOOD);
    vec2 id = cellOf(q.xy);
    vec3 l = q - vec3(cellCentre(id), 0.0);
    // the open drawer's cell is empty: the nearest fronts are its neighbours'
    if (id == vec2(2.0, 1.0)) return U(drawerFront(q - vec3(cellCentre(vec2(1.0, 1.0)), 0.0)), drawerFront(q - vec3(cellCentre(vec2(2.0, 0.0)), 0.0)));
    return drawerFront(l);
}

float carcass(vec3 p) {
    float d = sdRBox(p - vec3(0.0, YC, 0.0), BODY, 0.025);
    // the top, overhanging a little
    d = min(d, sdRBox(p - vec3(0.0, YC + BODY.y + 0.045, 0.02), vec3(BODY.x + 0.06, 0.045, BODY.z + 0.06), 0.03));
    // a moulding round the foot, and the plinth under it
    d = min(d, sdRBox(p - vec3(0.0, PLINTH + 0.03, 0.0), vec3(BODY.x + 0.025, 0.03, BODY.z + 0.025), 0.02));
    d = min(d, sdRBox(p - vec3(0.0, PLINTH * 0.5, -0.02), vec3(BODY.x - 0.05, PLINTH * 0.5 + 0.01, BODY.z - 0.06), 0.012));
    // the open drawer's slot
    d = max(d, -sdBox(p - vec3(OPEN, FRONT - 0.6), vec3(FACE + 0.01, 0.65)));
    return d;
}

// one card of the open drawer, in the drawer's coordinates
vec2 card(vec3 p, int i, out vec3 lp) {
    float fi = float(i);
    int g = guideAt(i);
    bool pick = i == PICK;
    float r = pick ? rise() : 0.0;
    float hh = CARD.y + (g >= 0 ? GUIDE_UP : 0.0);
    vec3 q = p - vec3((hash1(fi * 3.1) - 0.5) * 0.012, FLOORY + hopOf(i) + r * 0.36, -0.1 - fi * SP);
    // each leans a little its own way; the found one tips back to show its face
    float lean = (hash1(fi * 7.7) - 0.5) * 0.045 + (pick ? -0.07 * r : 0.0);
    q.y -= 0.2;
    q.yz = rot(lean) * q.yz;
    q.y += 0.2 - hh;
    lp = q;
    float th = g >= 0 ? 0.0055 : 0.0038;
    vec2 res = vec2(sdRBox(q, vec3(CARD.x, hh, th), th), g >= 0 ? M_GUIDE : M_CARD);
    if (g >= 0) res = U(res, vec2(sdRBox(q - vec3(tabX(g), hh + 0.02, 0.0), vec3(0.085, 0.045, th + 0.0015), th + 0.0015), M_TAB));
    // a sticky flag on the found card's top edge
    if (pick) res = U(res, vec2(sdRBox(q - vec3(0.25, hh + 0.005, th + 0.0012), vec3(0.038, 0.07, 0.0012), 0.0012), M_FLAG));
    return res;
}

// the nearest card's index for a point in the drawer
float cardIndex(vec3 p) { return clamp(floor((-0.1 - p.z) / SP + 0.5), 0.0, float(NCARDS - 1)); }

vec2 cards(vec3 p) {
    float bound = sdBox(p - vec3(0.0, 0.25, -0.95), vec3(0.47, 0.55, 0.95));
    if (bound > 0.35) return vec2(bound, M_CARD);
    vec3 lp;
    float c = cardIndex(p);
    vec2 r = card(p, PICK, lp);
    for (int k = -1; k <= 1; k++) {
        float j = c + float(k);
        if (j >= 0.0 && j <= float(NCARDS - 1) && int(j) != PICK) r = U(r, card(p, int(j), lp));
    }
    // the cards past those three are at least this far: past the edge of the
    // three cards' slab, or above the tops of all the cards but the found one
    float u = (-0.1 - p.z) / SP, beyond = 1e9;
    if (c + 2.0 <= float(NCARDS - 1)) beyond = (c + 1.5 - u) * SP;
    if (c - 2.0 >= 0.0) beyond = min(beyond, (u - c + 1.5) * SP);
    r.x = min(r.x, max(beyond, max(p.y - TOPMAX, abs(p.x) - CARD.x - 0.01)) + 0.002);
    return r;
}

vec2 openDrawer(vec3 p) {
    vec3 l = p - vec3(OPEN, FRONT + PULL);
    float bound = sdBox(l - vec3(0.0, 0.1, -1.0), vec3(0.62, 0.62, 1.25));
    if (bound > 0.35) return vec2(bound, M_WOOD);
    vec2 r = drawerFront(l);
    // the box: two sides and a floor
    vec3 s = l - vec3(0.0, -0.14, -1.1);
    float box = sdRBox(vec3(abs(s.x) - 0.448, s.y, s.z), vec3(0.022, 0.135, 1.1), 0.01);
    box = min(box, sdBox(s - vec3(0.0, -0.12, 0.0), vec3(0.47, 0.015, 1.1)));
    r = U(r, vec2(box, M_WOOD));
    // the brass rod that keeps the cards in, with a nut on the front
    vec3 rod = l - vec3(0.0, FLOORY + 0.04, 0.0);
    r = U(r, vec2(min(sdCapsule(rod, vec3(0.0, 0.0, -2.1), vec3(0.0, 0.0, 0.06), 0.012), sdRBox(rod - vec3(0.0, 0.0, 0.055), vec3(0.026, 0.026, 0.012), 0.008)), M_BRASS));
    return U(r, cards(l));
}

// a cloth-bound book lying flat, its spine towards +z
vec2 book(vec3 p, vec3 c, vec3 b, float ang, float tint) {
    vec3 q = p - c;
    q.xz = rot(ang) * q.xz;
    float board = 0.012;
    float cloth = sdRBox(q, b, 0.008);
    // the boards and the spine are left once the edges round the pages are cut away
    cloth = max(cloth, -sdBox(q - vec3(0.0, 0.0, -0.115), vec3(b.x + 0.1, b.y - board, b.z + 0.085)));
    float pages = sdBox(q - vec3(0.0, 0.0, -0.006), vec3(b.x - 0.01, b.y - board, b.z - 0.016));
    return U(vec2(cloth, M_CLOTH + tint), vec2(pages, M_PAGES));
}

// two books and a pencil left on the cabinet
vec2 props(vec3 p) {
    float bound = sdBox(p - vec3(-0.6, TOP + 0.2, 0.3), vec3(1.0, 0.22, 1.0));
    if (bound > 0.35) return vec2(bound, M_WOOD);
    vec2 r = book(p, vec3(-0.92, TOP + 0.05, 0.12), vec3(0.4, 0.05, 0.29), 0.16, 0.0);
    r = U(r, book(p, vec3(-0.88, TOP + 0.1 + 0.042, 0.1), vec3(0.34, 0.042, 0.245), -0.07, 0.5));
    // the pencil: hexagonal, sharpened, with a ferrule and an eraser
    vec3 q = p - vec3(-0.2, TOP + 0.026, 0.95);
    q.xz = rot(-0.42) * q.xz;
    r = U(r, vec2(sdHexPrism(vec3(q.y, q.z, q.x + 0.05), vec2(0.024, 0.35)), M_PAINT));
    float tip = sdRoundCone(vec3(q.y, q.x - 0.3, q.z), 0.0235, 0.002, 0.13);
    r = U(r, vec2(tip, q.x > 0.395 ? M_LEAD : M_CEDAR));
    vec3 e = vec3(q.x + 0.43, q.y, q.z);
    r = U(r, vec2(sdCapsule(e, vec3(-0.03, 0.0, 0.0), vec3(0.03, 0.0, 0.0), 0.026) , M_BRASS));
    r = U(r, vec2(sdCapsule(e, vec3(-0.09, 0.0, 0.0), vec3(-0.04, 0.0, 0.0), 0.024), M_ERASER));
    return r;
}

// Each part of the scene is skipped while a point is well clear of a box round
// it, but not within reach of the shadows and ambient occlusion, which would
// see the box
vec2 map(vec3 p) {
    vec2 r = vec2(p.y, M_FLOOR);
    r = U(r, vec2(carcass(p), M_WOOD));
    r = U(r, closedFronts(p));
    r = U(r, props(p));
    return U(r, openDrawer(p));
}

`;

        const MATERIALS = `
// ---- light
const vec3 KEY = normalize(vec3(-0.55, 1.35, 0.62));
const vec3 RIM = normalize(vec3(0.9, 0.5, -0.6));

// the backdrop, in display colours: pale and cool, lighter up top
vec3 backdrop(vec2 uv) {
    return mix(vec3(0.86, 0.885, 0.91), vec3(0.965, 0.975, 0.985), smoothstep(-0.9, 0.7, uv.y));
}

vec3 env(vec3 r) {
    vec3 sky = mix(vec3(0.72, 0.78, 0.86), vec3(1.0), smoothstep(0.0, 0.8, r.y));
    vec3 c = mix(vec3(0.42, 0.4, 0.38), sky, smoothstep(-0.15, 0.1, r.y));
    // the key's soft box and a strip light behind on the right
    c += vec3(5.0, 4.7, 4.3) * smoothstep(0.9, 0.97, dot(r, KEY));
    c += vec3(1.6, 1.8, 2.0) * smoothstep(0.88, 0.95, dot(r, RIM));
    return c;
}

vec3 woodColor(vec3 p, vec3 n) {
    // oak, its figure running along each board
    vec3 q = abs(n.x) > 0.5 ? p.zyx : p;
    float g = noise3(q * vec3(0.8, 22.0, 22.0)) * 0.6 + noise3(q * vec3(2.5, 60.0, 60.0)) * 0.4;
    float rings = sin(q.y * 38.0 + q.z * 9.0 + g * 7.0) * 0.5 + 0.5;
    return mix(vec3(0.2, 0.09, 0.032), vec3(0.42, 0.21, 0.085), 0.3 + 0.5 * rings * g + 0.2 * g);
}

vec3 shade(vec3 ro, vec3 rd, vec2 uv, float jitter) {
    vec2 h = march(ro, rd);
    vec3 bg = backdrop(uv);
    if (h.x < 0.0) return bg;
    vec3 p = ro + rd * h.x;
    float m = h.y;
    vec3 n = normal(p);
    float occ = ao(p, n);
    float sh = softShadow(p + n * 0.002, KEY, 6.0, jitter);
    float facing = abs(dot(n, rd));

    if (m == M_FLOOR) {
        // a shadow catcher: the backdrop, darkened where the cabinet shades it
        float k = mix(0.68, 1.0, sh) * mix(0.6, 1.0, occ);
        return mix(bg * mix(vec3(0.62, 0.7, 0.8), vec3(1.0), k), bg, smoothstep(9.0, 22.0, h.x));
    }

    vec3 alb, f0 = vec3(0.04);
    float rough = 0.5, metal = 0.0, wrap = 0.0;
    if (m == M_WOOD) {
        alb = woodColor(p, n);
        if (p.y < PLINTH + 0.07) alb *= 0.55;
        rough = 0.38;
    } else if (m == M_BRASS) {
        alb = vec3(0.0);
        f0 = vec3(0.92, 0.7, 0.36);
        rough = 0.28;
        metal = 1.0;
    } else if (m == M_LABEL) {
        // which drawer's label this is, and where on it
        vec3 q = p - vec3(0.0, YC, FRONT);
        vec2 id = cellOf(q.xy), c = cellCentre(id);
        if (p.z > FRONT + 0.3) { id = vec2(2.0, 1.0); c = OPEN - vec2(0.0, YC); }
        vec2 u = (q.xy - c - vec2(0.0, 0.1)) / vec2(0.304, 0.1) * vec2(1.0, -1.0) + 0.5;
        int li = int(id.x + (1.0 - id.y) * 3.0);
        vec4 rects[6] = vec4[6](${REGION.labels.map(glslRect).join(', ')});
        vec4 t = atlas(rects[li], u, lodAt(h.x, facing, 1050.0));
        alb = mix(vec3(0.86, 0.82, 0.7), t.rgb * 0.6, t.a);
        rough = 0.8;
    } else if (floor(m) == M_CLOTH) {
        // book cloth, a deep green and an oxblood, with a faint weave
        alb = fract(m) > 0.25 ? vec3(0.16, 0.035, 0.03) : vec3(0.025, 0.085, 0.065);
        alb *= 0.85 + 0.3 * noise3(p * 160.0);
        rough = 0.75;
    } else if (m == M_PAGES) {
        alb = vec3(0.8, 0.74, 0.6) * (0.9 + 0.1 * sin(p.y * 700.0));
        rough = 0.9;
    } else if (m == M_PAINT) {
        alb = vec3(0.86, 0.5, 0.02);
        rough = 0.25;
    } else if (m == M_CEDAR) {
        alb = vec3(0.62, 0.4, 0.22);
        rough = 0.8;
    } else if (m == M_LEAD) {
        alb = vec3(0.04);
        rough = 0.4;
    } else if (m == M_ERASER) {
        alb = vec3(0.8, 0.3, 0.3);
        rough = 0.85;
    } else if (m == M_FLAG) {
        alb = vec3(0.02, 0.5, 0.82);
        rough = 0.3;
        wrap = 0.4;
    } else {
        // a card: find which one, to read its face
        vec3 l = p - vec3(OPEN, FRONT + PULL);
        float c = cardIndex(l);
        vec3 lp, best;
        float bd = 1e9, bi = c;
        for (int k = -2; k <= 2; k++) {
            float j = k == 2 ? float(PICK) : c + float(k);
            if (j < 0.0 || j > float(NCARDS - 1)) continue;
            float d = card(l, int(j), lp).x;
            if (d < bd) { bd = d; bi = j; best = lp; }
        }
        int g = guideAt(int(bi));
        float hh = CARD.y + (g >= 0 ? GUIDE_UP : 0.0);
        if (m == M_TAB) {
            // celluloid-covered tabs, the letter typed on the front
            vec3 tints[5] = vec3[5](vec3(0.03, 0.42, 0.72), vec3(0.85, 0.32, 0.18), vec3(0.08, 0.5, 0.3), vec3(0.9, 0.62, 0.08), vec3(0.55, 0.25, 0.65));
            alb = mix(vec3(0.85, 0.82, 0.74), tints[g], 0.6);
            vec2 u = (best.xy - vec2(tabX(g), hh + 0.02)) / vec2(0.17, 0.09) * vec2(1.0, -1.0) + 0.5;
            vec4 tabs[5] = vec4[5](${REGION.tabs.map(glslRect).join(', ')});
            vec4 t = atlas(tabs[g], u, lodAt(h.x, facing, 1050.0));
            alb = mix(alb, vec3(0.06, 0.06, 0.08), t.a * step(0.0, best.z));
            rough = 0.2;
        } else if (g >= 0) {
            alb = vec3(0.7, 0.55, 0.32);
            rough = 0.8;
            wrap = 0.3;
        } else {
            alb = vec3(0.9, 0.875, 0.81);
            if (best.z > 0.0) {
                vec2 u = best.xy / (2.0 * vec2(CARD.x, hh)) * vec2(1.0, -1.0) + 0.5;
                vec4 others[4] = vec4[4](${REGION.cards.map(glslRect).join(', ')});
                vec4 t = int(bi) == PICK ? atlas(${glslRect(REGION.pick)}, u, lodAt(h.x, facing, 1264.0))
                                         : atlas(others[int(hash1(bi * 5.3) * 3.99)], u, lodAt(h.x, facing, 607.0));
                alb = mix(alb, t.rgb, t.a);
            }
            rough = 0.85;
            wrap = 0.35;
        }
    }

    // a warm key with soft shadows, a cool sky, a strip light behind on the
    // right and a little bounce off the floor
    float dif = clamp((dot(n, KEY) + wrap) / (1.0 + wrap), 0.0, 1.0) * sh;
    float sky = (0.6 + 0.4 * n.y) * occ;
    float rim = clamp(dot(n, RIM), 0.0, 1.0) * occ;
    float bounce = clamp(-n.y, 0.0, 1.0) * occ;
    vec3 light = vec3(2.7, 2.5, 2.25) * dif + vec3(0.56, 0.6, 0.68) * sky + vec3(0.55, 0.62, 0.72) * rim + vec3(0.32, 0.3, 0.28) * bounce;
    vec3 col = alb * light * (1.0 - metal);

    // reflections of the studio, blurrier and dimmer off rougher surfaces
    vec3 r = reflect(rd, n);
    float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
    vec3 F = f0 + (1.0 - f0) * fres;
    float gloss = 1.0 - rough;
    vec3 refl = metal > 0.5 ? mix(vec3(0.35, 0.32, 0.3), env(r), 0.85) * occ : env(r) * mix(0.25, 1.0, gloss * gloss) * mix(0.35, 1.0, sh) * occ * gloss * 0.9;
    col += F * refl;
    vec3 hv = normalize(KEY - rd);
    float spec = pow(clamp(dot(n, hv), 0.0, 1.0), mix(8.0, 180.0, gloss * gloss)) * gloss * gloss;
    col += F * spec * sh * vec3(2.4, 2.25, 2.0) * (metal > 0.5 ? 2.5 : 1.0);

    return toDisplay(col);
}

`;

        runStudio({
            frag: studioShader({ head: HEAD, geometry: GEOMETRY, materials: MATERIALS, atlasSize: ATLAS }),
            view: VIEW,
            frames: FRAMES,
            delay: DELAY,
            pose: f => { const { hops, rise } = pose(f); return { uHop: hops, uRise: rise }; },
            // Only the open drawer's cards move: round the drawer, and the
            // patch of floor off to the right where the found card's shadow
            // lands once it is up
            moving: [
                [[OPEN[0] - 0.5, OPEN[0] + 0.9], [OPEN[1] - 0.33, OPEN[1] + 0.8], [FRONT - 0.45, FRONT + PULL + 0.25]],
                [[OPEN[0] + 0.2, OPEN[0] + 1.9], [0, 0.1], [FRONT - 0.7, FRONT + 0.6]],
            ],
            atlas: makeAtlas,
            fonts: [new FontFace('Courier Prime', 'url("fonts/CourierPrime-Bold.woff2")', { weight: '700' })],
            title: ctx => studioTitle(ctx, { label: 'CASE STUDY', lines: ['Research', 'Agent'], pill: '#2fb5e8' }),
        });
    </script>
