<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Research Agent pixel art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="pixel.js"></script>
    <script>
        const INK = '#0b1d40';

        const ROBOT = [
            '..............KKKK..............',
            '.............KYWYYK.............',
            '.............KYYYYK.............',
            '..............KKKK..............',
            '...............KK...............',
            '...............KK...............',
            '..........KKKKKKKKKKKK..........',
            '........KKWWWWWWWWWWWWKK........',
            '.......KWWWWWWWWWWWWWWWWK.......',
            '......KWWWWWWWWWWWWWWWWWWK......',
            '.....KWWWWWWWWWWWWWWWWWWWWK.....',
            '....KWWKKKKKKKKKKKKKKKKKKWWK....',
            '...KWWWKVVVVVVVVVVVVVVVVKWWWK...',
            '..KKWWWKVVVVVVVVVVVVVVVVKWWWKK..',
            '.KBKWWWKVVVCCCVVVVCCCVVVKWWWKBK.',
            '.KBKWWWKVVVCCCVVVVCCCVVVKWWWKBK.',
            '.KBKWWWKVVVCCCVVVVCCCVVVKWWWKBK.',
            '.KBKWWWKVVVcccVVVVcccVVVKWWWKBK.',
            '.KBKWWWKVVVVVVVVVVVVVVVVKWWWKBK.',
            '..KKWWWKVVVVVCVVVVCVVVVVKWWWKK..',
            '...KWWWKVVVVVVCCCCVVVVVVKWWWK...',
            '...KWWWKKKKKKKKKKKKKKKKKKWWWK...',
            '...KWPPWWWWWWWWWWWWWWWWWWPPWK...',
            '....KLWWWWWWWWWWWWWWWWWWWWLK....',
            '.....KLLWWWWWWWWWWWWWWWWLLK.....',
            '......KLLLWWWWWWWWWWWWLLLK......',
            '.......KKLLLLLLLLLLLLLLKK.......',
            '.........KKKKKKKKKKKKKK.........',
        ];
        const ROBOT_PAL = { K: INK, W: '#ffffff', L: '#cfe6fa', B: '#8fcaf2', V: '#10305f', C: '#6fe3ff', c: '#3aa8d8', P: '#ff9fb8', Y: '#ffd23f' };

        const PAPER = [
            'KKKKKKKK...',
            'KWWWWWWKK..',
            'KWBBBBWKLK.',
            'KWWWWWWKKKK',
            'KWGGGGGGGWK',
            'KWWWWWWWWWK',
            'KWGGGGGGWWK',
            'KWWWWWWWWWK',
            'KWGGGGGGGWK',
            'KWWWWWWWWWK',
            'KWGGGGWWWWK',
            'KWWWWWWWWWK',
            'KKKKKKKKKKK',
        ];

        const BOOKS = ['#b04a4a', '#4a6ab0', '#c9a040', '#4a9a6a', '#7a4ab0', '#c07040', '#d8c8a0', '#5a8aa0', '#a05a80'];

        function library(p) {
            p.rect(0, 0, PW, PH, '#2a1a12');
            [2, 38, 74, 110].forEach((top, row) => {
                const plank = top + 30, rand = rng(row * 31 + 5);
                p.rect(0, top, PW, 30, '#3a2418');
                for (let x = 0; x < PW;) {
                    const w = 3 + Math.floor(rand() * 4), h = 17 + Math.floor(rand() * 11);
                    if (rand() < 0.07) { x += 3 + Math.floor(rand() * 6); continue; }
                    const c = BOOKS[Math.floor(rand() * BOOKS.length)], y = plank - h;
                    p.rect(x, y, w, h, c);
                    p.rect(x, y, 1, h, shade(c, 1.3));
                    p.rect(x + w - 1, y, 1, h, shade(c, 0.7));
                    p.rect(x, y + 3, w, 2, shade(c, 1.45));
                    p.rect(x, y + h - 5, w, 1, shade(c, 0.75));
                    x += w;
                }
                p.rect(0, plank, PW, 4, '#9a6232');
                p.rect(0, plank, PW, 1, '#c98a4a');
                p.rect(0, plank + 4, PW, 2, '#1e120c');
            });
            [0, 104, 212, 316].forEach(x => { p.rect(x, 0, 4, PH, '#7a4a24'); p.rect(x, 0, 1, PH, '#a86a36'); p.rect(x + 3, 0, 1, PH, '#4a2a14'); });
            // DS-style dim so the characters pop, plus a warm pool of lamplight
            p.rect(0, 0, PW, PH, '#10163088');
            [[74, '#ffd98a14'], [56, '#ffd98a18'], [40, '#ffe7a820']].forEach(([r, c]) => p.disc(226, 62, r, c));
        }

        function magnifier(p, lx, ly) {
            p.thick(lx - 10, ly + 10, lx - 22, ly + 22, 7, INK);
            p.thick(lx - 10, ly + 10, lx - 21, ly + 21, 4, '#c98a3a');
            p.disc(lx - 23, ly + 23, 5, INK);
            p.disc(lx - 23, ly + 23, 4, '#ffffff');
            p.disc(lx, ly, 15, INK);
            p.disc(lx, ly, 14, '#ffd23f');
            p.ring(lx, ly, 14, '#ffe98a');
            p.disc(lx, ly, 11, INK);
            p.disc(lx, ly, 10, '#c9ecff');
            p.sprite(PAPER, { K: INK, W: '#fff', B: '#2f86e0', G: '#9fb4cc', L: '#dcebf8' }, lx - 5, ly - 6);
            p.disc(lx, ly, 10, '#c9ecff40');
            [[-6, -7], [-7, -6], [-5, -8], [-8, -5], [-7, -7]].forEach(([dx, dy]) => p.set(lx + dx, ly + dy, '#fff'));
        }

        // Marching dots from the lens out to each paper it is reading
        function links(p, from, targets, f) {
            targets.forEach(([tx, ty]) => {
                const n = Math.max(Math.abs(tx - from[0]), Math.abs(ty - from[1]));
                for (let i = 0; i <= n; i++) {
                    if ((i + f) % 4) continue;
                    p.set(Math.round(from[0] + (tx - from[0]) * i / n), Math.round(from[1] + (ty - from[1]) * i / n), '#6fe3ff');
                }
            });
        }

        function dialog(p, f) {
            const X = 8, Y = 122, W = 304, H = 42;
            p.frame(X, Y, W, H, '#5aa0f0', INK, 2);
            p.frame(X + 3, Y + 3, W - 6, H - 6, '#fbfbf7', '#2f6fc0', 1);
            p.frame(X + 10, Y - 9, 42, 12, '#2f86e0', INK, 1);
            text(p, 'AGENT', X + 31, Y - 6, { color: '#fff', anchor: 'center' });
            text(p, 'I CAN DO THE RESEARCH, BUT I HAVE', X + 12, Y + 10, { color: '#383838', shadow: '#d4d4d4' });
            text(p, 'NO FRONT END. CAN YOU DESIGN ONE?', X + 12, Y + 23, { color: '#383838', shadow: '#d4d4d4' });
            text(p, '▼', X + W - 18, Y + H - 12 + (f % 6 < 3 ? 0 : 1), { color: '#e2413b' });
        }

        const BIG_ROBOT = scale2x(ROBOT);

        function draw(p, f) {
            library(p);
            const bob = Math.round(Math.sin((f / 12) * Math.PI * 2) * 2);
            const papers = [[276, 14, '#2f86e0', 0], [294, 52, '#22b573', 4], [266, 92, '#9b6bff', 8]]
                .map(([x, y, c, ph]) => [x, y + Math.round(Math.sin(((f + ph) / 12) * Math.PI * 2)), c]);
            const lens = [268, 58 + bob];
            links(p, lens, papers.map(([x, y]) => [x + 5, y + 6]), f);
            papers.forEach(([x, y, c]) => p.sprite(PAPER, { K: INK, W: '#fff', B: c, G: '#9fb4cc', L: '#dcebf8' }, x, y));

            const rx = 178, ry = 34 + bob;
            p.sprite(BIG_ROBOT, ROBOT_PAL, rx, ry);
            if (f === 7) {
                [22, 36].forEach(c => { p.rect(rx + c, ry + 28, 6, 8, '#10305f'); p.rect(rx + c, ry + 32, 6, 2, '#6fe3ff'); });
            }
            magnifier(p, lens[0], lens[1]);

            text(p, 'CASE STUDY', 12, 16, { color: '#fff', outline: INK });
            const blue = { size: 30, outlineWidth: 2, bands: ['#e6f6ff', '#9fd8ff', '#5ab4f5', '#2f86e0'], light: '#ffffff', dark: '#1b5fb5', outline: INK, rim: '#ffffff', shadow: '#00000088' };
            logo(p, 'Research', { ...blue, x: 10, y: 28 });
            logo(p, 'Agent', { ...blue, x: 10, y: 56 });

            dialog(p, f);
            [[160, 40, 0], [306, 10, 2], [246, 104, 1], [170, 96, 3]].forEach(([x, y, o]) => twinkle(p, x, y, (f + o) % 4, '#fff3c4'));
        }

        runFrames(draw, { frames: 12, delay: 140 });
    </script>
</body>
</html>
