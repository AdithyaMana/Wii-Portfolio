<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ICCA Report 8-bit art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="pixel.js"></script>
    <script src="nes.js"></script>
    <script>
        // Where everything sits on the wide canvas and on the tall phone one.
        // rock: the Acropolis plateau [left, right, top]; sea: its top edge
        const LAYOUT = TALL ? {
            icca: [67, 22], report: [67, 58], tagline: [67, 80], start: [67, 98],
            temple: [67, 150, 80], rock: [14, 121, 150], sea: 174, key: 224, sun: [110, 116], land: [190, 4],
            clouds: [[4, 4, 0.8]], cypress: [[10, 212, 26], [126, 214, 22]], houses: [0, 198, 135, 222], gull: [30, 112],
        } : {
            icca: [72, 15], report: [72, 48], tagline: [72, 67], start: [72, 84],
            temple: [182, 78, 80], rock: [128, 236, 78], sea: 94, key: 122, sun: [220, 20], land: [106, 6],
            clouds: [[118, 6, 0.8]], cypress: [[8, 120, 26], [232, 120, 24]], houses: [0, 110, 128, 121], gull: [118, 40],
        };

        function sky(p) {
            const sea = LAYOUT.sea;
            p.rect(0, 0, NW, sea, NES.sky);
            p.rect(0, sea - 14, NW, 14, NES.ice);
            const [sx, sy] = LAYOUT.sun;
            p.disc(sx, sy, 9, NES.yellow);
            p.disc(sx, sy, 7, NES.cream);
            LAYOUT.clouds.forEach(([x, y, s]) => nesCloud(p, x, y, s));
        }

        function sea(p, f) {
            const y0 = LAYOUT.sea;
            p.rect(0, y0, NW, NH - y0, NES.royal);
            p.rect(0, y0, NW, 1, NES.white);
            const rand = rng(6);
            for (let i = 0; i < 24; i++) {
                const x = Math.floor(rand() * NW), y = y0 + 3 + Math.floor(rand() * 12), k = Math.floor(rand() * 4);
                if ((f + k) % 4 < 2) p.rect(x, y, 3, 1, NES.blue);
                else p.rect(x + 1, y, 2, 1, NES.white);
            }
        }

        // the Acropolis: a flat-topped rock falling away to the sea
        function rock(p) {
            const [l, r, top] = LAYOUT.rock, sea = LAYOUT.sea + 10;
            for (let y = top; y < sea; y++) {
                const t = (y - top) / (sea - top), ease = t * t;
                const a = Math.round(l - ease * 26), b = Math.round(r + ease * 16);
                p.rect(a, y, b - a, 1, y < top + 2 ? NES.cream : (y - top) % 9 < 2 ? NES.rust : NES.orange);
                p.set(a, y, NES.black);
                p.set(b, y, NES.black);
            }
            p.rect(l, top - 1, r - l, 1, NES.black);
            // scrub clinging to the slopes
            const rand = rng(9);
            for (let i = 0; i < 9; i++) {
                const y = top + 6 + Math.floor(rand() * (sea - top - 10)), t = (y - top) / (sea - top);
                const x = rand() < 0.5 ? Math.round(l - t * t * 26 + 2 + rand() * 8) : Math.round(r + t * t * 16 - 10 + rand() * 6);
                p.disc(x, y, 2, NES.black);
                p.disc(x, y, 1, NES.green);
            }
        }

        // The Parthenon: steps, eight columns, the frieze, the pediment
        function temple(p, f) {
            const [cx, base, w] = LAYOUT.temple, l = cx - w / 2;
            const colH = Math.round(w * 0.26), top = base - 6 - colH;
            // shaded cella behind the colonnade
            p.rect(l + 2, top, w - 4, colH, NES.olive);
            for (let k = 0; k < 8; k++) {
                const x = Math.round(l + 1 + k * (w - 8) / 7);
                p.rect(x, top, 6, colH, NES.black);
                p.rect(x + 1, top, 2, colH, NES.white);
                p.rect(x + 3, top, 2, colH, NES.silver);
                p.rect(x - 1, top - 2, 8, 2, NES.black);
                p.rect(x, top - 2, 6, 1, NES.white);
            }
            // steps
            [[0, NES.cream], [2, NES.peach], [4, NES.cream]].forEach(([d, c], i) => {
                p.rect(l - 2 - i * 2, base - 6 + d, w + 4 + i * 4, 2, c);
                p.rect(l - 2 - i * 2, base - 6 + d + 1, w + 4 + i * 4, 1, i === 2 ? NES.black : NES.olive);
            });
            // entablature and frieze with its triglyphs
            const e = top - 9;
            p.rect(l - 3, e, w + 6, 7, NES.black);
            p.rect(l - 2, e + 1, w + 4, 2, NES.white);
            p.rect(l - 2, e + 3, w + 4, 3, NES.cream);
            for (let x = l; x < l + w; x += 5) p.rect(x, e + 3, 2, 3, NES.silver);
            // pediment
            const ph = Math.round(w * 0.14);
            for (let j = 0; j <= ph; j++) {
                const half = Math.round((w / 2 + 3) * j / ph);
                p.rect(cx - half - 1, e - ph + j - 1, half * 2 + 2, 1, NES.black);
                if (j > 0) p.rect(cx - half + 1, e - ph + j - 1, half * 2 - 2, 1, j > 2 && half > 6 ? NES.peach : NES.white);
            }
            if (f % 6 === 3) twinkle(p, cx - w / 2 + 6, e - 4, 2, NES.white);
        }

        // the city's ground, rising gently towards the Acropolis
        function land(p) {
            const [top, rise] = LAYOUT.land;
            for (let x = 0; x < NW; x++) {
                const y = Math.round(top - rise * x / NW);
                p.rect(x, y, 1, LAYOUT.key - y, NES.peach);
                p.set(x, y, NES.black);
                p.set(x, y + 1, NES.cream);
            }
        }

        function houses(p) {
            const [x0, y0, x1, y1] = LAYOUT.houses, rand = rng(11);
            for (let i = 0; i < 26; i++) {
                const w = 6 + Math.floor(rand() * 6), h = 5 + Math.floor(rand() * 4);
                const x = x0 + Math.floor(rand() * (x1 - x0 - w)), y = y0 + Math.floor(rand() * (y1 - y0));
                p.rect(x - 1, y - h - 1, w + 2, h + 2, NES.black);
                p.rect(x, y - h, w, h, NES.white);
                p.rect(x, y - h, w, 1, rand() < 0.5 ? NES.rust : NES.cream);
                p.set(x + 2, y - h + 3, NES.blue);
                if (w > 8) p.set(x + w - 3, y - h + 3, NES.blue);
            }
        }

        function cypress(p, x, base, h) {
            for (let y = 0; y < h; y++) {
                const half = Math.round(3.5 * Math.sin(Math.PI * Math.min(1, (y + 2) / h)) + 0.5);
                p.rect(x - half - 1, base - y, half * 2 + 3, 1, NES.black);
            }
            for (let y = 1; y < h - 1; y++) {
                const half = Math.round(3.5 * Math.sin(Math.PI * Math.min(1, (y + 2) / h)) + 0.5);
                p.rect(x - half, base - y, half * 2 + 1, 1, NES.forest);
                if (y % 4 < 2) p.rect(x - half + 1, base - y, 1, 1, NES.green);
            }
        }

        // Greek key border along the bottom
        function meander(p) {
            const y0 = LAYOUT.key;
            p.rect(0, y0, NW, NH - y0, NES.navy);
            p.rect(0, y0, NW, 1, NES.gold);
            const KEY = ['########', '.......#', '.#####.#', '.#...#.#', '.#.#.#.#', '.#.###.#', '.#.....#', '##.#####'];
            for (let x = 0; x < NW; x += 8) p.sprite(KEY, { '#': NES.gold }, x, y0 + 3);
        }

        // olive-leaf laurel branch curling up beside the title; side is -1 or 1
        function laurel(p, x, y, side, len) {
            for (let i = 0; i < len; i++) {
                const t = i / len, px = Math.round(x + side * 7 * Math.sin(t * 1.9)), py = y - i;
                p.set(px, py, NES.olive);
                if (i % 4 === 1) {
                    p.sprite(['.##', '###', '##.'], { '#': NES.gold }, px - (side > 0 ? 0 : 2) + side * 2, py - 1, { flip: side < 0 });
                    p.sprite(['##.', '###', '.##'], { '#': NES.yellow }, px - 1 - side * 3, py - 1, { flip: side < 0 });
                }
            }
        }

        function gull(p, f, x, y) {
            const up = f % 4 < 2, bob = up ? 0 : 1;
            p.sprite(up ? ['#.....#', '.#...#.', '..#.#..', '...#...'] : ['.......', '##...##', '..#.#..', '...#...'], { '#': NES.white }, x, y + bob);
        }

        function draw(p, f) {
            sky(p);
            sea(p, f);
            rock(p);
            land(p);
            houses(p);
            temple(p, f);
            LAYOUT.cypress.forEach(([x, base, h]) => cypress(p, x, base, h));
            meander(p);
            gull(p, f, ...LAYOUT.gull);

            const [ix, iy] = LAYOUT.icca, [rx, ry] = LAYOUT.report;
            nesLogo(p, 'ICCA', ix, iy, { scale: 4, anchor: 'center', top: NES.white, bottom: NES.ice, shine: NES.white, shadow: NES.navy, drop: 3 });
            const { w: rw } = nesLogo(p, 'REPORT', rx, ry, { scale: 2, anchor: 'center', top: NES.yellow, bottom: NES.gold, shine: NES.cream, shadow: NES.brown });
            laurel(p, rx - rw / 2 - 10, ry + 16, -1, TALL ? 18 : 24);
            laurel(p, rx + rw / 2 + 9, ry + 16, 1, TALL ? 18 : 24);
            const [tx, ty] = LAYOUT.tagline;
            ['SCIENCE FOR BETTER', 'HEALTHCARE MEETINGS'].forEach((line, i) => nesText(p, line, tx, ty + i * 7, { micro: true, anchor: 'center', color: NES.white, outline: NES.navy }));
            pushStart(p, f, ...LAYOUT.start);
        }

        runFrames(draw, { frames: 12, delay: 140, size: [NW, NH] });
    </script>
</body>
</html>
