<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Overtone 8-bit art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="pixel.js"></script>
    <script src="nes.js"></script>
    <script>
        const CARDS = [
            { word: 'VINE', color: NES.green, tags: 2, n: '21' },
            { word: 'ECHO', color: NES.sky, tags: 2, n: '21' },
            { word: 'OMEN', color: NES.plum, tags: 3, n: '31', danger: true },
            { word: 'DELTA', color: NES.teal, tags: 2, n: '21' },
            { word: 'FOSSIL', color: NES.orange, tags: 2, n: '21' },
        ];

        // Where everything sits on the wide canvas and on the tall phone one
        const LAYOUT = TALL ? {
            title: [[67, 28, 'OVER'], [67, 56, 'TONE']], tagline: [[67, 88, 'MEANING IS'], [67, 99, 'THE PHYSICS']],
            wave: 194, amp: 14, cards: [67, 136, 22], chips: [[10, 116, '+55', NES.royal], [95, 116, '*2.5', NES.red]], start: 212,
        } : {
            title: [[71, 15, 'OVER'], [171, 15, 'TONE']], tagline: [[120, 44, 'MEANING IS THE PHYSICS']],
            wave: 88, amp: 22, cards: [120, 67, 30], chips: [[8, 63, '+55', NES.royal], [199, 65, '*2.5', NES.red]], start: 114,
        };

        function stars(p, f) {
            const rand = rng(17);
            for (let i = 0; i < (TALL ? 50 : 55); i++) {
                const x = Math.floor(rand() * NW), y = Math.floor(rand() * NH), k = Math.floor(rand() * 4);
                if (k === 0 && f % 4 < 2) continue;
                p.set(x, y, k === 1 ? NES.white : k === 2 ? NES.silver : NES.gray);
            }
        }

        // The harmonic series as standing waves: each overtone swings at its
        // own multiple of the fundamental, so the loop closes after 12 frames
        function harmonics(p, f) {
            const cy = LAYOUT.wave;
            [NES.salmon, NES.gold, NES.sky, NES.lilac].forEach((c, k) => {
                const n = k + 1, amp = LAYOUT.amp / Math.sqrt(n), swing = Math.cos(2 * Math.PI * n * f / 12);
                let prev = null;
                for (let x = 0; x < NW; x++) {
                    const y = Math.round(cy + amp * Math.sin(n * Math.PI * x / NW) * swing);
                    if (prev !== null) for (let yy = Math.min(prev, y); yy <= Math.max(prev, y); yy++) p.set(x, yy, c);
                    prev = y;
                }
            });
        }

        function card(p, c, x, y, picked, blink) {
            const W = 26, H = 34;
            if (picked && blink) p.rect(x - 2, y - 2, W + 4, H + 4, NES.gold);
            p.rect(x, y, W, H, NES.black);
            p.rect(x + 1, y + 1, W - 2, H - 2, NES.white);
            p.rect(x + 1, y + 1, W - 2, 10, c.color);
            p.rect(x + 1, y + 11, W - 2, 1, NES.black);
            // three glyphs across the header
            [5, 12, 19].forEach((dx, i) => p.sprite([['.#.', '###', '.#.'], ['###', '#.#', '###'], ['.#.', '#.#', '###']][i], { '#': NES.white }, x + dx - 1, y + 4));
            nesText(p, c.word, x + 3, y + 14, { color: NES.black, micro: true });
            for (let t = 0; t < c.tags; t++) {
                const danger = c.danger && t === 0;
                p.rect(x + 3, y + 21 + t * 4, danger ? 14 : 11 + t * 2, 3, danger ? NES.orange : NES.silver);
            }
            nesText(p, c.n, x + W - 3, y + H - 7, { color: NES.black, micro: true, anchor: 'right' });
        }

        function hand(p, f) {
            const [cx, top, step] = LAYOUT.cards, arc = [6, 2, -5, 2, 6];
            const bob = Math.round(Math.sin((f / 12) * Math.PI * 2));
            [0, 1, 3, 4, 2].forEach(k => {
                const x = cx + (k - 2) * step - 13, y = top + arc[k] + (k === 2 ? bob : 0);
                card(p, CARDS[k], x, y, k === 2, f % 4 < 2);
            });
        }

        function chip(p, f, x, y, label, fill, i) {
            const w = glyphMask(NES_FONT, label, 1, 0).w + 8, bob = Math.round(Math.sin(((f + i * 6) / 12) * Math.PI * 2) * 2);
            p.rect(x - 1, y - 1 + bob, w + 2, 13, NES.black);
            p.rect(x, y + bob, w, 11, fill);
            p.rect(x + 1, y + 1 + bob, w - 2, 1, NES.white);
            nesText(p, label, x + 4, y + 2 + bob, { color: NES.white, shadow: NES.black });
        }

        function draw(p, f) {
            p.rect(0, 0, NW, NH, NES.black);
            stars(p, f);
            harmonics(p, f);
            hand(p, f);
            LAYOUT.chips.forEach(([x, y, label, fill], i) => chip(p, f, x, y, label, fill, i));
            const [over, tone] = LAYOUT.title;
            nesLogo(p, over[2], over[0], over[1], { anchor: 'center', top: NES.orange, bottom: NES.red, shine: NES.cream, shadow: NES.maroon });
            nesLogo(p, tone[2], tone[0], tone[1], { anchor: 'center', top: NES.yellow, bottom: NES.gold, shine: NES.white, shadow: NES.olive });
            LAYOUT.tagline.forEach(([x, y, line]) => nesText(p, line, x, y, { anchor: 'center', color: NES.ice, shadow: NES.navy }));
            pushStart(p, f, NW / 2, LAYOUT.start);
        }

        runFrames(draw, { frames: 12, delay: 140, size: [NW, NH] });
    </script>
</body>
</html>
