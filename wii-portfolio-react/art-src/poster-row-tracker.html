<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poster-Row Tracker 3D art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="studio.js"></script>
    <script>
        // A short row of the poster hall as a little diorama: three light
        // wooden A-frame stands with tidy academic posters and blue aisle
        // signs, on a square of blue carpet. Four Miis stand still reading
        // them, two together at the middle poster, each on a glowing tracking
        // ring, with a heat pool in front of the most-viewed poster.
        //
        // The posters and signs are drawn on a canvas the shader reads as a
        // texture; studio.js does the rest. It holds still: one frame.

        const VIEW = viewFrom(TALL ? {
            eye: [2.8, 7.0, 13.0], target: [-0.1, 0.8, 0.5], zoom: 2.4, shift: [0.0, -0.17],
        } : {
            eye: [5.3, 5.5, 13.5], target: [0.1, 0.75, 0.35], zoom: 4.9, shift: [0.31, -0.02],
        });

        // ---- the atlas: three posters and three aisle signs
        const ATLAS = 2048;
        const PW = 0.6, PH = 0.76;                  // half size of a poster, in world units
        const PWPX = 640, PHPX = Math.round(640 * PH / PW);
        const POSTERS = [[8, 8, PWPX, PHPX], [660, 8, PWPX, PHPX], [1312, 8, PWPX, PHPX]];
        const SIGN_HALF = [0.46, 0.13];
        const SIGNS = [[8, 900, 720, 204], [8, 1116, 720, 204], [8, 1332, 720, 204]];
        const SIGN_TEXT = ['LBP 009-014', 'LBP 015-020', 'LBP 021-026'];

        function makeAtlas() {
            const c = document.createElement('canvas');
            c.width = c.height = ATLAS;
            const ctx = c.getContext('2d');
            const rr = (x, y, w, h, r, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); };
            const lines = (x, y, widths, fill, gap = 20, h = 8) => widths.forEach((w, i) => rr(x, y + i * gap, w, h, h / 2, fill));

            // ---- the posters, all on one grid: a navy title band with an
            // accent rule, three columns, a footer. One accent each.
            const NAVY = '#1c2b4a', GREY = '#c9cfd8', PANEL = '#eef1f6';
            const accents = ['#0f9d8f', '#c8283d', '#e8a317'];
            const M = 28, G = 16, CW = (PWPX - 2 * M - 2 * G) / 3;
            const colX = i => M + i * (CW + G);
            accents.forEach((acc, k) => {
                const [x, y, w, h] = POSTERS[k];
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                // title band: one title bar, an author line, a logo square
                ctx.fillStyle = NAVY;
                ctx.fillRect(0, 0, w, 124);
                ctx.fillStyle = acc;
                ctx.fillRect(0, 124, w, 8);
                rr(M, 34, 400, 28, 14, '#ffffff');
                rr(M, 80, 250, 10, 5, 'rgba(255,255,255,0.6)');
                rr(w - M - 60, 32, 60, 60, 12, acc);
                rr(w - M - 44, 48, 28, 28, 14, '#ffffff');
                const head = (cx, cy) => rr(cx, cy, 78, 11, 5.5, NAVY);
                // column 1: abstract and methods
                head(colX(0), 160);
                lines(colX(0), 188, [CW, CW, CW - 20, CW, CW - 40, CW, CW - 10, CW, CW - 30, CW - 70], GREY);
                head(colX(0), 432);
                lines(colX(0), 460, [CW, CW - 14, CW, CW - 34, CW, CW - 22, CW, CW - 40], GREY);
                // column 2: a chart and the results
                head(colX(1), 160);
                rr(colX(1), 186, CW, 210, 8, PANEL);
                const px = colX(1) + 16, pw = CW - 32;
                ctx.fillStyle = NAVY; ctx.fillRect(px, 368, pw, 3); ctx.fillRect(px, 204, 3, 166);
                if (k === 1) {
                    ctx.strokeStyle = acc; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath();
                    [[0, 340], [30, 312], [60, 324], [90, 280], [120, 262], [pw - 8, 232]].forEach(([dx, dy], i) => i ? ctx.lineTo(px + 8 + dx, dy) : ctx.moveTo(px + 8 + dx, dy));
                    ctx.stroke();
                    [[0, 340], [60, 324], [120, 262], [pw - 8, 232]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(px + 8 + dx, dy, 6, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 4; ctx.stroke(); });
                } else {
                    [0.4, 0.62, 0.5, 0.9, 0.72].forEach((v, i) => rr(px + 10 + i * 27, 366 - 150 * v, 18, 150 * v, 3, acc));
                }
                head(colX(1), 432);
                [0, 1, 2, 3].forEach(i => {
                    ctx.beginPath(); ctx.arc(colX(1) + 6, 472 + i * 46, 5, 0, 7); ctx.fillStyle = acc; ctx.fill();
                    lines(colX(1) + 20, 468 + i * 46, [CW - 20, CW - 70], GREY, 18, 8);
                });
                // column 3: a figure panel and the conclusions
                head(colX(2), 160);
                rr(colX(2), 186, CW, 210, 8, PANEL);
                const fx = colX(2) + 16;
                if (k === 0) {
                    const nodes = [[30, 80], [92, 56], [140, 108], [60, 148], [120, 156]];
                    nodes.forEach(([dx, dy], i, a) => {
                        if (!i) return;
                        ctx.strokeStyle = GREY; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx + a[i - 1][0], 200 + a[i - 1][1]); ctx.lineTo(fx + dx, 200 + dy); ctx.stroke();
                    });
                    nodes.forEach(([dx, dy], i) => { ctx.beginPath(); ctx.arc(fx + dx, 200 + dy, i === 1 ? 14 : 10, 0, 7); ctx.fillStyle = i === 1 ? acc : NAVY; ctx.fill(); });
                } else if (k === 1) {
                    for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) rr(fx + i * 28, 204 + j * 44, 24, 38, 4, acc + (['40', '70', 'a0', 'ff'][(i * 3 + j * 2) % 4]));
                } else {
                    ctx.beginPath(); ctx.arc(fx + 66, 292, 56, 0, 7); ctx.arc(fx + 66, 292, 30, 0, 7, true); ctx.fillStyle = NAVY; ctx.fill('evenodd');
                    ctx.beginPath(); ctx.arc(fx + 66, 292, 56, -1.57, 0.7); ctx.arc(fx + 66, 292, 30, 0.7, -1.57, true); ctx.fillStyle = acc; ctx.fill();
                }
                head(colX(2), 432);
                lines(colX(2), 460, [CW, CW - 24, CW, CW - 50], GREY);
                // QR square in the corner
                rr(colX(2) + CW - 84, 560, 84, 84, 6, '#eef1f6');
                for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) {
                    const corner = (i < 3 && j < 3) || (i > 3 && j < 3) || (i < 3 && j > 3);
                    if (corner || (i * 5 + j * 3 + k) % 3 === 0) rr(colX(2) + CW - 80 + i * 11.4, 564 + j * 11.4, 10, 10, 2, NAVY);
                }
                // references and a footer rule
                head(colX(0), 672);
                lines(colX(0), 700, [CW * 2 + G, CW * 2 + G - 40, CW * 2 + G - 10], GREY);
                ctx.fillStyle = NAVY; ctx.fillRect(0, h - 22, w, 22);
                rr(M, h - 14, 120, 6, 3, 'rgba(255,255,255,0.6)');
                ctx.restore();
            });

            // ---- the aisle-end signs: white type on blue
            SIGNS.forEach(([x, y, w, h], k) => {
                const g = ctx.createLinearGradient(0, y, 0, y + h);
                g.addColorStop(0, '#3a7bec'); g.addColorStop(1, '#2459c8');
                ctx.fillStyle = g;
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = '#ffffff';
                ctx.font = '100px Rodin';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText(SIGN_TEXT[k], x + w / 2, y + h / 2 + 34);
            });
            return c;
        }

        const SP = 1.75, SZ = -0.5, TILT = 0.1;
        // the rear leg's top in a stand's own offset frame (the tilted frame turned back)
        const REAR_TOP = [0, Math.cos(TILT) * 2.0 + Math.sin(TILT) * -0.06, SZ - Math.sin(TILT) * 2.0 + Math.cos(TILT) * -0.06];

        const GEOMETRY = `
const float M_FLOOR = 0.0, M_WOOD = 1.0, M_PAPER = 2.0, M_CARPET = 3.0, M_SIGN = 4.0;
const float M_BODY = 6.0, M_HAIR = 7.0, M_SKIN = 8.0, M_PANTS = 9.0, M_SHOE = 10.0;
const float SP = ${SP}, SZ = ${SZ}, TILT = ${TILT};
const float TOP = 0.09;                          // the carpet's top face
const vec2 PHALF = vec2(${PW}, ${PH});
const vec2 SHALF = vec2(${SIGN_HALF.join(', ')});
const float PY = 1.4;                            // height of a poster's middle, in stand space
const float SIGNY = PY + PHALF.y + 0.06 + SHALF.y - 0.01;   // the sign's middle
const vec3 REAR_TOP = vec3(${REAR_TOP.map(v => v.toFixed(3)).join(', ')});
const vec3 REAR_FOOT = vec3(0.0, 0.0, ${SZ - 0.8});

// a stand's own space: the frame stands straight and faces +z, and leans back a little
vec3 standSpace(vec3 q) {
    vec3 l = q - vec3(0.0, 0.0, SZ);
    l.yz = rot(-TILT) * l.yz;
    return l;
}

// the Miis: one at the first poster, two sharing the middle one, one at the third
vec3 visPos(int i) {
    if (i == 0) return vec3(-1.78, TOP, 0.85);
    if (i == 1) return vec3(-0.4, TOP, 0.8);
    if (i == 2) return vec3(0.4, TOP, 0.86);
    return vec3(1.78, TOP, 0.85);
}
float visYaw(int i) { return i == 0 ? 0.12 : i == 1 ? -0.14 : i == 2 ? 0.18 : -0.1; }

float ell(vec3 p, vec3 r) { return (length(p / r) - 1.0) * min(r.x, min(r.y, r.z)); }

vec2 stand(vec3 p, int i) {
    float cx = float(i - 1) * SP;
    vec3 q = p - vec3(cx, TOP, 0.0);
    float bound = sdBox(q - vec3(0.0, 1.3, SZ - 0.35), vec3(0.85, 1.5, 0.85));
    if (bound > 0.3) return vec2(bound, M_WOOD);
    vec3 l = standSpace(q);
    // the frame round the poster, with its poster set in the face
    float frame = sdRBox(l - vec3(0.0, PY, 0.0), vec3(PHALF + 0.06, 0.03), 0.014);
    vec2 r = vec2(frame, M_WOOD);
    r = U(r, vec2(sdBox(l - vec3(0.0, PY, 0.03), vec3(PHALF, 0.006)), M_PAPER));
    // the front legs run on down from the frame, a bar between them
    r = U(r, vec2(sdRBox(vec3(abs(l.x) - 0.54, l.y - 0.5, l.z), vec3(0.04, 0.52, 0.028), 0.01), M_WOOD));
    r = U(r, vec2(sdRBox(l - vec3(0.0, 0.38, 0.0), vec3(0.54, 0.035, 0.024), 0.008), M_WOOD));
    // the rear leg, hinged to a small block at the top
    r = U(r, vec2(sdCapsule(q, REAR_TOP + vec3(0.0, 0.08, 0.0), REAR_FOOT, 0.035), M_WOOD));
    r = U(r, vec2(sdRBox(l - vec3(0.0, PY + PHALF.y - 0.06, -0.05), vec3(0.08, 0.05, 0.05), 0.012), M_WOOD));
    // the blue aisle-end sign, sat on the frame's top edge
    r = U(r, vec2(sdRBox(l - vec3(0.0, SIGNY, 0.0), vec3(SHALF, 0.03), 0.012), M_SIGN));
    return r;
}

// a Mii: a big round head, a short rounded body, arms at its sides, short legs
// and small feet, facing -z, towards the poster
vec2 mii(vec3 p, int i) {
    const float S = 1.25;
    vec3 q = (p - visPos(i)) / S;
    q.xz = rot(visYaw(i)) * q.xz;
    float bound = sdBox(q - vec3(0.0, 0.55, 0.0), vec3(0.45, 0.6, 0.4)) * S;
    if (bound > 0.25) return vec2(bound, M_BODY);
    float fi = float(i) * 0.1;
    vec3 s = vec3(abs(q.x), q.y, q.z);                       // mirrored for the pairs of parts
    vec2 r = vec2(sdRBox(q - vec3(0.0, 0.45, 0.0), vec3(0.14, 0.12, 0.09), 0.075), M_BODY + fi);
    r.x = min(r.x, sdCapsule(s, vec3(0.2, 0.53, 0.0), vec3(0.225, 0.37, -0.03), 0.05));
    r = U(r, vec2(length(s - vec3(0.23, 0.32, -0.035)) - 0.045, M_SKIN + fi));
    r = U(r, vec2(sdCapsule(s, vec3(0.075, 0.31, 0.0), vec3(0.075, 0.1, 0.0), 0.066), M_PANTS + fi));
    r = U(r, vec2(ell(s - vec3(0.075, 0.04, -0.03), vec3(0.068, 0.04, 0.1)), M_SHOE));
    // the head, with ears
    vec3 h = q - vec3(0.0, 0.78, 0.0);
    r = U(r, vec2(min(ell(h, vec3(0.215, 0.2, 0.2)), ell(vec3(abs(h.x) - 0.205, h.y + 0.01, h.z), vec3(0.03, 0.045, 0.035))), M_SKIN + fi));
    // the hair, over the top and the back of the head
    float hair = max(ell(h - vec3(0.0, 0.02, 0.02), vec3(0.23, 0.218, 0.224)), dot(h, normalize(vec3(0.0, -0.45, -1.0))) - 0.085);
    if (i == 1) hair = min(hair, max(sdRBox(h - vec3(0.0, -0.07, 0.07), vec3(0.2, 0.13, 0.14), 0.07), -h.z - 0.02));
    if (i == 2) hair = min(hair, length(h - vec3(0.04, 0.215, -0.03)) - 0.075);
    if (i == 3) hair = min(hair, length(h - vec3(0.0, 0.25, 0.1)) - 0.09);
    r = U(r, vec2(hair, M_HAIR + fi));
    r.x *= S;
    return r;
}

vec2 map(vec3 p) {
    vec2 r = vec2(p.y, M_FLOOR);
    // the carpet tile, a thick rounded slab
    r = U(r, vec2(sdRBox(p - vec3(0.0, TOP * 0.5, 0.45), vec3(2.85, TOP * 0.5, 1.8), 0.03), M_CARPET));
    for (int i = 0; i < 3; i++) r = U(r, stand(p, i));
    for (int i = 0; i < 4; i++) r = U(r, mii(p, i));
    return r;
}
`;

        const MATERIALS = `
// ---- light
const vec3 KEY = normalize(vec3(-0.55, 1.35, 0.62));
const vec3 RIM = normalize(vec3(0.9, 0.5, -0.6));

// the backdrop, in display colours: pale sky blue, lighter up top
vec3 backdrop(vec2 uv) {
    return mix(vec3(0.76, 0.85, 0.96), vec3(0.94, 0.965, 1.0), smoothstep(-0.9, 0.7, uv.y));
}

vec3 env(vec3 r) {
    vec3 sky = mix(vec3(0.7, 0.78, 0.9), vec3(1.0), smoothstep(0.0, 0.8, r.y));
    vec3 c = mix(vec3(0.38, 0.4, 0.44), sky, smoothstep(-0.15, 0.1, r.y));
    c += vec3(5.0, 4.7, 4.3) * smoothstep(0.9, 0.97, dot(r, KEY));
    c += vec3(1.6, 1.8, 1.9) * smoothstep(0.88, 0.95, dot(r, RIM));
    return c;
}

vec3 d2l(vec3 c) { return pow(c, vec3(2.2)); }

vec3 woodColor(vec3 p, vec3 n) {
    // pale beech, its figure running along each part
    vec3 q = abs(n.x) > 0.5 ? p.zyx : p;
    float g = noise3(q * vec3(0.8, 22.0, 22.0)) * 0.6 + noise3(q * vec3(2.5, 60.0, 60.0)) * 0.4;
    float rings = sin(q.y * 30.0 + q.z * 8.0 + g * 6.0) * 0.5 + 0.5;
    return mix(vec3(0.45, 0.26, 0.11), vec3(0.78, 0.55, 0.3), 0.4 + 0.4 * rings * g + 0.2 * g);
}

// a tracking ring: a steady line, a soft glow and a fainter outer halo
float ringGlow(vec2 d, float big) {
    float r = length(d);
    float R = 0.4 + 0.05 * big, w = 0.02;
    float a = smoothstep(w, w * 0.4, abs(r - R)) + 0.3 * exp(-abs(r - R) * 16.0);
    a += 0.35 * smoothstep(w, w * 0.4, abs(r - R - 0.17)) * (1.0 - smoothstep(0.0, 0.5, r - R));
    return a;
}

vec3 shade(vec3 ro, vec3 rd, vec2 uv, float jitter) {
    vec2 h = march(ro, rd);
    vec3 bg = backdrop(uv);
    if (h.x < 0.0) return bg;
    vec3 p = ro + rd * h.x;
    float m = h.y;
    vec3 n = normal(p);
    float occ = ao(p, n);
    float sh = softShadow(p + n * 0.002, KEY, 7.0, jitter);
    float facing = abs(dot(n, rd));

    if (m == M_FLOOR) {
        // a shadow catcher: the backdrop, darkened where the scene shades it
        float k = mix(0.62, 1.0, sh) * mix(0.55, 1.0, occ);
        return mix(bg * mix(vec3(0.62, 0.72, 0.86), vec3(1.0), k), bg, smoothstep(9.0, 22.0, h.x));
    }

    vec3 alb = vec3(0.8), f0 = vec3(0.04), glow = vec3(0.0);
    float rough = 0.5, wrap = 0.0;
    float mi = floor(m + 0.01);
    int idx = int((m - mi) * 10.0 + 0.5);
    int stand = int(clamp(floor((p.x + SP * 0.5) / SP) + 1.0, 0.0, 2.0));
    vec3 sl = standSpace(p - vec3(float(stand - 1) * SP, TOP, 0.0));
    vec3 sn = n;
    sn.yz = rot(-TILT) * sn.yz;

    if (mi == M_WOOD) {
        alb = d2l(woodColor(p, n));
        rough = 0.45;
    } else if (mi == M_PAPER) {
        vec2 u = vec2(sl.x / (2.0 * PHALF.x) + 0.5, 0.5 - (sl.y - PY) / (2.0 * PHALF.y));
        vec4 rect = stand == 0 ? ${glslRect(POSTERS[0])} : stand == 1 ? ${glslRect(POSTERS[1])} : ${glslRect(POSTERS[2])};
        vec4 t = atlas(rect, u, lodAt(h.x, facing, 640.0));
        alb = t.a > 0.0 ? pow(t.rgb, vec3(2.2)) : vec3(0.9);
        rough = 0.6;
        wrap = 0.15;
    } else if (mi == M_SIGN) {
        alb = d2l(vec3(0.2, 0.4, 0.82));
        rough = 0.4;
        if (sn.z > 0.7) {
            vec2 u = vec2(sl.x / (2.0 * SHALF.x) + 0.5, 0.5 - (sl.y - SIGNY) / (2.0 * SHALF.y));
            vec4 rect = stand == 0 ? ${glslRect(SIGNS[0])} : stand == 1 ? ${glslRect(SIGNS[1])} : ${glslRect(SIGNS[2])};
            vec4 t = atlas(rect, u, lodAt(h.x, facing, 680.0));
            alb = mix(alb, pow(t.rgb, vec3(2.2)), t.a);
        }
    } else if (mi == M_CARPET) {
        vec3 base = d2l(vec3(0.15, 0.33, 0.78));
        // short woven pile, tile seams every unit and a paler aisle lane
        float pile = noise3(vec3(p.x * 70.0, p.z * 70.0, 1.0)) * 0.5 + noise3(vec3(p.x * 160.0, 0.0, p.z * 160.0)) * 0.5;
        alb = base * (0.93 + 0.14 * pile);
        rough = 0.95;
        if (n.y > 0.5) {
            vec2 g = abs(fract(p.xz + vec2(0.5)) - 0.5);
            float seam = smoothstep(0.012, 0.0, min(g.x, g.y));
            alb *= 1.0 - 0.18 * seam;
            alb = mix(alb, d2l(vec3(0.24, 0.45, 0.88)), 0.5 * smoothstep(0.3, 0.38, p.z) * smoothstep(1.85, 1.77, p.z));
            // the heat pool in front of the most viewed poster, in bands
            vec2 hd = (p.xz - vec2(0.0, 0.5)) / vec2(1.25, 0.85);
            float heat = exp(-dot(hd, hd) * 1.7);
            vec3 hot = mix(d2l(vec3(1.0, 0.45, 0.35)), d2l(vec3(1.0, 0.8, 0.3)), smoothstep(0.45, 0.8, heat));
            alb = mix(alb, hot, smoothstep(0.1, 0.5, heat) * 0.8);
            glow += hot * 0.5 * smoothstep(0.3, 0.9, heat);
            // tracking rings under each Mii
            float rg = 0.0;
            for (int i = 0; i < 4; i++) rg += ringGlow(p.xz - visPos(i).xz, float(i == 1 || i == 2));
            glow += vec3(0.35, 1.5, 1.75) * clamp(rg, 0.0, 1.4);
            alb = mix(alb, d2l(vec3(0.75, 0.95, 1.0)), clamp(rg, 0.0, 1.0) * 0.4);
        }
    } else if (mi == M_BODY) {
        vec3 c[4] = vec3[4](vec3(0.38, 0.68, 0.96), vec3(0.9, 0.28, 0.3), vec3(0.36, 0.76, 0.42), vec3(1.0, 0.64, 0.22));
        alb = d2l(c[idx]);
        rough = 0.55;
        wrap = 0.25;
    } else if (mi == M_HAIR) {
        vec3 c[4] = vec3[4](vec3(0.36, 0.21, 0.11), vec3(0.1, 0.09, 0.11), vec3(0.92, 0.72, 0.3), vec3(0.55, 0.2, 0.12));
        alb = d2l(c[idx]);
        rough = 0.5;
        wrap = 0.2;
    } else if (mi == M_SKIN) {
        vec3 c[4] = vec3[4](vec3(0.98, 0.8, 0.68), vec3(0.86, 0.63, 0.47), vec3(0.62, 0.43, 0.31), vec3(0.99, 0.86, 0.75));
        alb = d2l(c[idx]);
        rough = 0.55;
        wrap = 0.3;
    } else if (mi == M_PANTS) {
        vec3 c[4] = vec3[4](vec3(0.2, 0.23, 0.34), vec3(0.24, 0.24, 0.28), vec3(0.62, 0.52, 0.4), vec3(0.2, 0.23, 0.34));
        alb = d2l(c[idx]);
        rough = 0.65;
    } else if (mi == M_SHOE) {
        alb = d2l(vec3(0.95, 0.95, 0.97));
        rough = 0.5;
    }

    // a warm key with soft shadows, a cool sky, a strip light behind on the
    // right and a little bounce off the floor
    float dif = clamp((dot(n, KEY) + wrap) / (1.0 + wrap), 0.0, 1.0) * sh;
    float sky = (0.6 + 0.4 * n.y) * occ;
    float rim = clamp(dot(n, RIM), 0.0, 1.0) * occ;
    float bounce = clamp(-n.y, 0.0, 1.0) * occ;
    vec3 light = vec3(2.7, 2.5, 2.25) * dif + vec3(0.56, 0.62, 0.7) * sky + vec3(0.55, 0.65, 0.75) * rim + vec3(0.3, 0.32, 0.34) * bounce;
    vec3 col = alb * light;

    vec3 r = reflect(rd, n);
    float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
    vec3 F = f0 + (1.0 - f0) * fres;
    float gloss = 1.0 - rough;
    col += F * env(r) * mix(0.25, 1.0, gloss * gloss) * mix(0.35, 1.0, sh) * occ * gloss * 0.9;
    vec3 hv = normalize(KEY - rd);
    float spec = pow(clamp(dot(n, hv), 0.0, 1.0), mix(8.0, 180.0, gloss * gloss)) * gloss * gloss;
    col += F * spec * sh * vec3(2.4, 2.25, 2.0);
    col += glow;

    return toDisplay(col);
}
`;

        // the title, in the studio's pill-and-two-lines layout but sized to
        // fit the longer first line
        function title(ctx) {
            const label = 'WEBSITE', lines = ['Poster-Row', 'Tracker'];
            const x = TALL ? W / 2 : 150, align = TALL ? 'center' : 'left';
            const y0 = TALL ? 290 : 372;
            ctx.font = '32px Rodin';
            ctx.letterSpacing = '6px';
            const lw = ctx.measureText(label).width + 52, lx = TALL ? x - lw / 2 : x;
            ctx.fillStyle = '#2f6be0';
            ctx.beginPath();
            ctx.roundRect(lx, y0 - 50, lw, 64, 32);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText(label, lx + 29, y0 - 6);
            // the biggest type that keeps the first line inside its space
            ctx.letterSpacing = '-3px';
            let size = 200;
            ctx.font = `${size}px Rodin`;
            size *= (TALL ? 900 : 700) / ctx.measureText(lines[0]).width;
            size = Math.min(size, TALL ? 168 : 158);
            ctx.font = `${size}px Rodin`;
            ctx.textAlign = align;
            ctx.fillStyle = '#25304a';
            lines.forEach((line, i) => ctx.fillText(line, x - (TALL ? 0 : 8), y0 + 30 + size * (0.92 + i * 1.06)));
            ctx.letterSpacing = '0px';
        }

        runStudio({
            frag: studioShader({ geometry: GEOMETRY, materials: MATERIALS, atlasSize: ATLAS }),
            view: VIEW,
            atlas: makeAtlas,
            title,
        });
    </script>
