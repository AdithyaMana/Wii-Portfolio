<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume pixel art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="pixel.js"></script>
    <script src="mii-faces.js"></script>
    <script>
        const INK = '#4a1410';
        const RED = '#e2413b';


        // skill badges: design, research, code, 3D, games, XR, agents, chat
        const BADGES = ['pencil', 'magnifier', 'code', 'cube', 'gamepad', 'headset', 'robot', 'chat'];
        const BADGE_COLORS = ['#ff5d8f', '#ffb020', '#27c3a4', '#4c8dff', '#9b6bff', '#ff7a45', '#17b3d6', '#e2413b'];

        function cloud(p, x, y, s) {
            const puffs = [[0, 0, 6], [8, -3, 8], [17, 0, 6], [-6, 2, 4], [23, 3, 4]]
                .map(([dx, dy, r]) => [x + Math.round(dx * s), y + Math.round(dy * s), Math.max(2, Math.round(r * s))]);
            const base = y + Math.round(5 * s);
            const puff = (cx, cy, r, c) => {
                for (let j = -r; j <= r; j++) {
                    for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r * 0.8 && cy + j <= base) p.set(cx + i, cy + j, c);
                }
            };
            puffs.forEach(([cx, cy, r]) => puff(cx, cy + 2, r, '#cfe6f8'));
            puffs.forEach(([cx, cy, r]) => puff(cx, cy, r, '#ffffff'));
        }

        function tree(p, x, y) {
            p.rect(x - 2, y, 5, 12, '#5a3418');
            p.rect(x - 1, y, 3, 11, '#8a5a2b');
            p.disc(x, y - 6, 12, '#1f5a24');
            p.disc(x, y - 6, 11, '#3fa34a');
            p.disc(x - 3, y - 9, 6, '#5cbf55');
            p.disc(x - 4, y - 10, 2, '#8fdc6f');
        }

        // Where everything sits on the wide canvas and on the tall phone one.
        // horizon is where the hills meet the sky; the path starts there at pathX.
        const LAYOUT = TALL ? {
            horizon: 246, pathX: 96, flowers: 50, clouds: [[112, 14, 1], [150, 64, 0.6], [8, 104, 0.6]], trees: [[158, 244], [20, 300]],
            title: [24, 26], start: [90, 268], card: [18, 108],
            twinkles: [[164, 22, 0], [10, 60, 2], [170, 110, 1], [12, 250, 3], [166, 290, 2]],
        } : {
            horizon: 118, pathX: 116, flowers: 70, clouds: [[26, 12, 1.1], [132, 30, 0.8], [118, 6, 0.6]], trees: [[150, 116], [22, 158]],
            title: [24, 14], start: [84, 100], card: [168, 14],
            twinkles: [[160, 14, 0], [304, 6, 2], [8, 60, 1], [156, 84, 3], [314, 150, 2]],
        };

        function scenery(p) {
            const H0 = LAYOUT.horizon, px = LAYOUT.pathX;
            p.vgrad(0, 0, PW, H0, ['#2f7fe0', '#4f9cf0', '#7fc0fa', '#b6e2ff', '#dcf3ff']);
            LAYOUT.clouds.forEach(([x, y, s]) => cloud(p, x, y, s));
            for (let x = 0; x < PW; x++) {
                const far = Math.round(H0 - 14 + 5 * Math.sin(x / 23) + 3 * Math.sin(x / 9 + 1));
                p.rect(x, far, 1, 1, '#b0e0b0');
                p.rect(x, far + 1, 1, H0 + 6 - far, '#7fc48a');
                const near = Math.round(H0 - 2 + 4 * Math.sin(x / 31 + 2) + 2 * Math.sin(x / 13));
                p.rect(x, near, 1, 1, '#8fd87a');
                p.rect(x, near + 1, 1, PH - near, '#5cbf52');
            }
            p.vgrad(0, H0 + 14, PW, PH - H0 - 14, ['#5cbf52', '#50b048', '#43a23f']);
            // dirt path running off towards the hills
            for (let y = H0; y < PH; y++) {
                const t = (y - H0) / (PH - H0), cx = Math.round(px - t * 40), half = Math.round(2 + t * 20);
                p.rect(cx - half - 1, y, half * 2 + 3, 1, '#c89a5a');
                p.rect(cx - half, y, half * 2 + 1, 1, '#e8c98a');
            }
            const rand = rng(4);
            for (let i = 0; i < LAYOUT.flowers; i++) {
                const x = Math.floor(rand() * PW), y = H0 + 6 + Math.floor(rand() * (PH - H0 - 8));
                const t = (y - H0) / (PH - H0);
                if (Math.abs(x - (px - t * 40)) < 6 + t * 22) continue;
                if (rand() < 0.7) p.sprite(['..#..', '#.#.#', '#.#.#'], { '#': '#378f37' }, x, y);
                else {
                    const petal = ['#ffffff', '#ffe066', '#ff8fb1'][Math.floor(rand() * 3)];
                    p.sprite(['.#.', '#o#', '.#.'], { '#': petal, o: '#f0a020' }, x, y);
                }
            }
            LAYOUT.trees.forEach(([x, y]) => tree(p, x, y));
        }

        function chip(p, str, x, y, color) {
            const w = textWidth(str);
            p.panel(x, y, w + 4, 9, color, 1);
            text(p, str, x + 2, y + 1, { color: '#fff' });
        }

        function card(p, f) {
            const [X, Y] = LAYOUT.card, W = 144, H = 146;
            p.frame(X, Y, W, H, RED, INK, 2);
            p.rect(X + 3, Y + 2, W - 6, 1, '#ff7f70');
            text(p, 'RESUME CARD', X + W / 2, Y + 4, { color: '#fff', shadow: '#9e1712', anchor: 'center' });
            p.frame(X + 4, Y + 14, W - 8, H - 18, '#fff6e8', '#9e1712', 1);
            for (let j = Y + 16; j < Y + H - 5; j += 2) p.rect(X + 5, j, W - 10, 1, '#fdeedb');

            // portrait, blinking now and then
            p.frame(X + 8, Y + 18, 34, 42, '#bfe3ff', INK, 1);
            p.rect(X + 9, Y + 48, 32, 11, '#9fd0f5');
            p.sprite(ADI_MII, ADI_MII_PAL, X + 11, Y + 19);
            if (f === 9) {
                [7, 16].forEach(c => {
                    p.rect(X + 11 + c, Y + 19 + 19, 5, 1, ADI_MII_PAL.S);
                    p.rect(X + 11 + c, Y + 19 + 20, 5, 1, ADI_MII_PAL.K);
                    p.rect(X + 11 + c + 1, Y + 19 + 21, 3, 1, ADI_MII_PAL.S);
                });
            }

            text(p, 'ADITHYA', X + 48, Y + 20, { color: '#3b2622', scale: 2 });
            chip(p, 'DESIGNER', X + 48, Y + 38, '#ff7a45');
            chip(p, 'ENGINEER', X + 48, Y + 48, '#4c8dff');
            chip(p, 'RESEARCHER', X + 48, Y + 58, '#27b38f');

            text(p, 'BADGES', X + 8, Y + 71, { color: '#b8574a' });
            BADGES.forEach((name, i) => {
                const bx = X + 8 + i * 16, by = Y + 81;
                p.frame(bx, by, 14, 14, BADGE_COLORS[i], INK, 1);
                p.rect(bx + 2, by + 1, 10, 1, '#ffffff55');
                icon(p, name, bx + 2, by + 2);
            });

            [['DESIGN', 9], ['CODE', 8], ['RESEARCH', 9]].forEach(([label, v], i) => {
                const ry = Y + 101 + i * 12;
                text(p, label, X + 8, ry, { color: '#6a3a30' });
                for (let s = 0; s < 10; s++) {
                    const on = s < v;
                    p.rect(X + 62 + s * 7, ry, 6, 7, on ? '#ff8a3d' : '#f0dccb');
                    if (on) p.rect(X + 62 + s * 7, ry, 6, 2, '#ffc24a');
                }
            });
        }

        function draw(p, f) {
            scenery(p);
            const [tx, ty] = LAYOUT.title;
            logo(p, 'My', {
                x: tx, y: ty, size: 42, outlineWidth: 2,
                bands: ['#fff3a6', '#ffd84a', '#ffb020', '#f28a12'], light: '#fffbe0', dark: '#c46200',
                outline: INK, rim: '#ffffff', shadow: '#1d3f8a66',
            });
            logo(p, 'Resume', {
                x: tx - 14, y: ty + 40, size: 36, outlineWidth: 2,
                bands: ['#ffffff', '#fff4ef', '#ffe0d6', '#ffc9b8'], light: '#ffffff', dark: '#f0a590',
                outline: '#9e1712', rim: '#ffffff', shadow: '#1d3f8a66',
            });
            if (f % 12 < 8) text(p, 'PRESS START', ...LAYOUT.start, { color: '#ffffff', outline: INK, anchor: 'center' });
            card(p, f);
            LAYOUT.twinkles.forEach(([x, y, o]) => twinkle(p, x, y, (f + o) % 4));
        }

        runFrames(draw, { frames: 12, delay: 140 });
    </script>
</body>
</html>
