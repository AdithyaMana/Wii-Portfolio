<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BetterPoster 8-bit art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="pixel.js"></script>
    <script src="nes.js"></script>
    <script>
        // Where everything sits on the wide canvas and on the tall phone one
        const LAYOUT = TALL ? {
            title: [67, 24, 2, 'center'], tagline: [[67, 72, 'EVIDENCE-BASED'], [67, 82, 'POSTER TEMPLATES']],
            poster: [26, 102, 84, 56], ground: 200, start: [67, 214], watch: [111, 92],
            clouds: [[8, 6, 1], [100, 2, 0.6], [4, 100, 0.7]], hills: [[20, 200, 44, 30], [110, 200, 34, 22]],
        } : {
            title: [12, 15, 3, 'left'], tagline: [[12, 70, 'EVIDENCE-BASED'], [12, 80, 'POSTER TEMPLATES']],
            poster: [174, 40, 58, 40], ground: 116, start: [84, 98], watch: [216, 14],
            clouds: [[172, 2, 0.7], [150, 90, 0.5]], hills: [[40, 116, 46, 30], [140, 116, 30, 18]],
        };

        function hill(p, cx, base, rx, ry) {
            for (let y = base - ry - 1; y < base; y++) {
                for (let x = cx - rx - 1; x <= cx + rx + 1; x++) {
                    const d = ((x - cx) / (rx + 1)) ** 2 + ((y - base) / (ry + 1)) ** 2, e = ((x - cx) / rx) ** 2 + ((y - base) / ry) ** 2;
                    if (e <= 1) p.set(x, y, NES.green);
                    else if (d <= 1) p.set(x, y, NES.black);
                }
            }
            // the dark spots every hill in the Mushroom Kingdom has
            [[-0.35, 0.55], [0.3, 0.4], [0.05, 0.75]].forEach(([u, v]) => {
                const sx = Math.round(cx + u * rx), sy = Math.round(base - v * ry);
                p.rect(sx - 1, sy, 3, 2, NES.forest);
                p.rect(sx, sy - 1, 1, 4, NES.forest);
            });
        }

        function ground(p) {
            const gy = LAYOUT.ground;
            p.rect(0, gy, NW, NH - gy, NES.green);
            p.rect(0, gy, NW, 2, NES.lime);
            p.rect(0, gy + 2, NW, 1, NES.black);
            for (let x = 3; x < NW; x += 8) for (let y = gy + 6 + (x % 16 ? 5 : 0); y < NH; y += 10) p.sprite(['#.#', '.#.'], { '#': NES.forest }, x, y);
        }

        // An 8-bit #betterposter: skinny side columns, the main finding big in
        // the green middle, a QR code for the paper, figures down the right
        function poster(p, f, x, y, W, H) {
            const lx = x + 3, cx0 = x + Math.round(W * 0.28), cx1 = x + Math.round(W * 0.72), rx = cx1 + 3;
            // easel: ledge in front, legs down to the grass
            const gy = LAYOUT.ground + 1, mid = x + W / 2;
            p.line(mid, y - 4, mid, gy, NES.brown);
            [[x + 8, x + 2], [x + W - 9, x + W - 3]].forEach(([top, foot]) => {
                p.line(top, y + H, foot, gy, NES.brown);
                p.line(top + 1, y + H, foot + 1, gy, NES.olive);
            });
            p.rect(x, y, W, H, NES.black);
            p.rect(x + 1, y + 1, W - 2, H - 2, NES.white);
            // left column: title, authors, sections
            [0.8, 0.65].forEach((k, i) => p.rect(lx, y + 3 + i * 3, Math.round((cx0 - lx - 2) * k), 2, NES.black));
            for (let s = 0, sy = y + 11; sy < y + H - 6; s++, sy += Math.max(8, Math.round(H / 4))) {
                p.rect(lx, sy, Math.round((cx0 - lx) * 0.5), 1, NES.green);
                for (let l = 0; l < 3 && sy + 3 + l * 2 < y + H - 3; l++) p.rect(lx, sy + 3 + l * 2, cx0 - lx - 3 - (l % 2) * 2, 1, NES.silver);
            }
            // the finding, in plain English
            p.rect(cx0, y + 2, cx1 - cx0, H - 4, NES.green);
            const tw = cx1 - cx0 - 6;
            [[0.6, NES.white], [0.95, NES.yellow], [0.55, NES.white], [0.75, NES.white]].forEach(([k, c], i) =>
                p.rect(cx0 + 3, y + 5 + i * Math.max(3, Math.round(H / 11)), Math.round(tw * k), Math.max(2, Math.round(H / 20)), c));
            // QR code with its three finder squares
            const q = Math.max(7, Math.round(H / 5)), qx = cx0 + 3, qy = y + H - q - 4, rand = rng(42);
            p.rect(qx - 1, qy - 1, q + 2, q + 2, NES.white);
            for (let j = 0; j < q; j++) for (let i = 0; i < q; i++) if (rand() < 0.5) p.set(qx + i, qy + j, NES.black);
            [[0, 0], [q - 3, 0], [0, q - 3]].forEach(([i, j]) => { p.rect(qx + i, qy + j, 3, 3, NES.black); });
            // right column: a bar chart, a trend line, then text
            const ch = Math.round(H * 0.3), base = y + 3 + ch;
            [0.4, 0.6, 0.8, 1].forEach((k, i) => p.rect(rx + i * Math.max(3, Math.round((x + W - 3 - rx) / 4)), base - Math.round(ch * k), 2, Math.round(ch * k), [NES.pale, NES.mint, NES.green, NES.forest][i]));
            p.rect(rx - 1, base, x + W - 3 - rx + 1, 1, NES.black);
            const ly = base + Math.max(4, Math.round(H * 0.12));
            p.line(rx, ly + 5, rx + Math.round((x + W - 4 - rx) * 0.5), ly + 2, NES.orange);
            p.line(rx + Math.round((x + W - 4 - rx) * 0.5), ly + 2, x + W - 4, ly, NES.orange);
            for (let l = 0; ly + 9 + l * 2 < y + H - 3; l++) p.rect(rx, ly + 9 + l * 2, x + W - 4 - rx - (l % 2) * 2, 1, NES.silver);
            p.rect(x - 2, y + H, W + 4, 3, NES.olive);
            p.rect(x - 2, y + H + 3, W + 4, 1, NES.brown);
            // a glint sweeping over the paper now and then
            if (f % 6 === 2) twinkle(p, x + W - 6, y + 4, 2, NES.white);
        }

        // the 5 second rule as a power-up: a stopwatch whose hand ticks round
        function stopwatch(p, f, x, y) {
            const bob = [0, 0, -1, -1, -1, 0][f % 6];
            p.sprite([
                '....KKK....',
                '....KRK....',
                '..KKKKKKK..',
                '.KWWWWWWWK.',
                'KWWWWWWWWWK',
                'KWWWWWWWWWK',
                'KWWWWWWWWWK',
                'KWWWWWWWWWK',
                'KWWWWWWWWWK',
                '.KWWWWWWWK.',
                '..KKKKKKK..',
            ], { K: NES.black, R: NES.red, W: NES.white }, x, y + bob);
            const hands = [[0, -3], [2, -2], [3, 0], [2, 2], [0, 3], [-2, 2], [-3, 0], [-2, -2]];
            const [hx, hy] = hands[Math.floor(f * hands.length / 12)];
            p.line(x + 5, y + 6 + bob, x + 5 + hx, y + 6 + hy + bob, NES.green);
            p.set(x + 5, y + 6 + bob, NES.black);
            nesText(p, '5 SEC', x + 5, y + 13 + bob, { micro: true, anchor: 'center', color: NES.white, outline: NES.black });
        }

        function draw(p, f) {
            p.rect(0, 0, NW, NH, NES.sky);
            LAYOUT.clouds.forEach(([x, y, s]) => nesCloud(p, x, y, s));
            LAYOUT.hills.forEach(([cx, base, rx, ry]) => hill(p, cx, base, rx, ry));
            ground(p);
            poster(p, f, ...LAYOUT.poster);
            stopwatch(p, f, ...LAYOUT.watch);

            const [tx, ty, scale, anchor] = LAYOUT.title;
            const hashW = glyphMask(NES_FONT, '#', scale, 0).w;
            const betterW = glyphMask(NES_FONT, 'BETTER', scale, 0).w, left = anchor === 'center' ? tx - Math.round((hashW + scale + betterW) / 2) : tx;
            nesLogo(p, '#', left, ty, { scale, top: NES.yellow, bottom: NES.gold, shadow: NES.royal });
            nesLogo(p, 'BETTER', left + hashW + scale, ty, { scale, top: NES.white, bottom: NES.silver, shine: NES.white, shadow: NES.royal });
            nesLogo(p, 'POSTER', tx, ty + scale * 9, { scale, anchor, top: NES.mint, bottom: NES.green, shine: NES.pale, shadow: NES.forest });
            LAYOUT.tagline.forEach(([x, y, line]) => nesText(p, line, x, y, { anchor: TALL ? 'center' : 'left', shadow: NES.black }));
            pushStart(p, f, ...LAYOUT.start);
        }

        runFrames(draw, { frames: 12, delay: 140, size: [NW, NH] });
    </script>
</body>
</html>
