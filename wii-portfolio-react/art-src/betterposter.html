<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BetterPoster 3D art</title>
</head>
<body>
    <pre id="out"></pre>
    <script src="studio.js"></script>
    <script>
        // A #BetterPoster poster, rendered in 3D like a Wii channel banner: a
        // landscape poster on a foam board, resting on a light oak easel on a
        // pale mint studio floor. It holds still: one frame.
        //
        // The poster itself is drawn on a canvas the shader reads as a texture,
        // set in the Wii's Rodin. studio.js does the rest.

        const VIEW = viewFrom(TALL ? {
            eye: [2.8, 3.0, 7.6], target: [0.2, 1.55, 0.0], zoom: 2.15, shift: [0.0, -0.1],
        } : {
            eye: [2.5, 2.7, 7.2], target: [0.2, 1.6, 0.0], zoom: 3.3, shift: [0.33, -0.02],
        });

        // ---- the poster, in a 1000-unit wide drawing scaled onto the atlas
        const ATLAS = 2048;
        const POSTER = [8, 8, 2032, 1287];   // atlas rectangle, 3 x 1.9 units on the board
        const BOARD = [1.5, 0.95];            // half size of the foam board

        function makeAtlas() {
            const c = document.createElement('canvas');
            c.width = c.height = ATLAS;
            const ctx = c.getContext('2d');
            const k = POSTER[2] / 1000, PH = 1000 * POSTER[3] / POSTER[2];
            ctx.translate(POSTER[0], POSTER[1]);
            ctx.scale(k, k);
            const GREEN = '#1fa65a', DARK = '#1f2d2a', LIGHT = '#c9d2ce', MID = '#8c9a95';
            const rr = (x, y, w, h, r, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); };
            const lines = (x, y, widths, fill, gap = 17, h = 9) => widths.forEach((w, i) => rr(x, y + i * gap, w, h, h / 2, fill));

            // the paper
            ctx.fillStyle = '#fbfaf4';
            ctx.fillRect(0, 0, 1000, PH);
            ctx.fillStyle = '#ecebe2';
            ctx.fillRect(0, 0, 1000, 5);

            // left column: a dark title block, then three sections of text
            rr(30, 34, 232, 20, 10, DARK);
            rr(30, 64, 204, 20, 10, DARK);
            rr(30, 94, 132, 20, 10, DARK);
            lines(30, 140, [168, 118], MID, 18, 10);
            [[212, [232, 202, 232, 160]], [352, [232, 200, 232, 162, 200]], [492, [232, 204, 232, 170]]].forEach(([y, w]) => {
                rr(30, y, 64, 13, 6.5, GREEN);
                lines(30, y + 32, w, LIGHT);
            });

            // the green centre panel, and the finding in big type
            const g = ctx.createLinearGradient(0, 24, 0, PH - 24);
            g.addColorStop(0, '#2bb566');
            g.addColorStop(1, '#168a4a');
            rr(300, 24, 398, PH - 48, 20, g);
            ctx.textBaseline = 'alphabetic';
            ctx.textAlign = 'left';
            const words = [['Say the', '#ffffff'], ['main finding', '#ffd84a'], ['in plain', '#ffffff'], ['English.', '#ffffff']];
            let size = 80;
            ctx.font = `${size}px Rodin`;
            size *= 336 / Math.max(...words.map(([w]) => ctx.measureText(w).width));
            ctx.font = `${size}px Rodin`;
            words.forEach(([w, col], i) => { ctx.fillStyle = col; ctx.fillText(w, 336, 138 + i * size * 1.28); });
            lines(336, 395, [330, 276, 232], 'rgba(255,255,255,0.45)', 17, 8);

            // the QR code
            rr(336, 462, 112, 112, 8, '#ffffff');
            const N = 21, m = 92 / N, rand = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(11);
            const finder = (cx, cy) => (cx < 7 && cy < 7) || (cx > 13 && cy < 7) || (cx < 7 && cy > 13);
            ctx.fillStyle = '#10201a';
            for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
                if (finder(x, y)) continue;
                if (rand() > 0.5) ctx.fillRect(346 + x * m, 472 + y * m, m + 0.4, m + 0.4);
            }
            [[0, 0], [14, 0], [0, 14]].forEach(([fx, fy]) => {
                ctx.fillStyle = '#10201a';
                ctx.fillRect(346 + fx * m, 472 + fy * m, 7 * m, 7 * m);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(346 + (fx + 1) * m, 472 + (fy + 1) * m, 5 * m, 5 * m);
                ctx.fillStyle = '#10201a';
                ctx.fillRect(346 + (fx + 2) * m, 472 + (fy + 2) * m, 3 * m, 3 * m);
            });
            ctx.fillStyle = '#ffffff';
            ctx.font = '27px Rodin';
            ctx.fillText('Scan for the', 466, 524);
            ctx.fillText('full paper', 466, 556);

            // right column: a bar chart and a line chart, then more text
            rr(726, 34, 244, 188, 12, '#ecf2ee');
            [[0.34, '#a6dcba'], [0.5, '#6cc58f'], [0.74, '#2bb566'], [1.0, '#168a4a']].forEach(([h, col], i) => {
                rr(748 + i * 54, 196 - 140 * h, 38, 140 * h, 4, col);
            });
            ctx.fillStyle = DARK;
            ctx.fillRect(742, 196, 216, 3);
            rr(726, 246, 244, 160, 12, '#ecf2ee');
            const pts = [[748, 380], [800, 360], [846, 368], [892, 322], [948, 304]];
            ctx.strokeStyle = '#f0a030';
            ctx.lineWidth = 6;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
            ctx.stroke();
            pts.slice(1).forEach(([x, y]) => {
                ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 5; ctx.stroke();
            });
            lines(726, 442, [244, 204, 244, 168, 224, 190], LIGHT);
            rr(726, 560, 64, 13, 6.5, GREEN);
            lines(726, 586, [170], LIGHT);
            return c;
        }

        const TILT = 0.16, EZ = 0.45;
        // the rear leg's top, in the world (the tilted easel frame turned back)
        const REAR_TOP = [0, Math.cos(TILT) * 2.88 + Math.sin(TILT) * -0.1, EZ - Math.sin(TILT) * 2.88 + Math.cos(TILT) * -0.1];

        const GEOMETRY = `
const float M_FLOOR = 0.0, M_OAK = 1.0, M_FOAM = 2.0;
const float TILT = ${TILT};
const float EZ = ${EZ};
const vec2 BOARD = vec2(${BOARD.join(', ')});
const float BOARD_Y = 2.0;                  // height of the board's middle, in easel space
const vec3 REAR_TOP = vec3(${REAR_TOP.map(v => v.toFixed(3)).join(', ')});
const vec3 REAR_FOOT = vec3(0.0, 0.035, -1.45);

// the easel's own space: its front legs stand straight up and the board
// faces along +z; the whole thing leans back a little
vec3 easelSpace(vec3 p) {
    vec3 l = p - vec3(0.0, 0.0, EZ);
    l.yz = rot(-TILT) * l.yz;
    return l;
}

float easel(vec3 p) {
    vec3 b = p - vec3(0.0, 1.6, -0.35);
    float bound = sdBox(b, vec3(1.75, 1.75, 1.3));
    if (bound > 0.35) return bound;
    vec3 l = easelSpace(p);
    // the front legs, and the bars across them at the top and lower down
    float d = sdRBox(vec3(abs(l.x) - 1.12, l.y - 1.55, l.z), vec3(0.05, 1.55, 0.032), 0.012);
    d = min(d, sdRBox(l - vec3(0.0, 3.0, 0.0), vec3(1.17, 0.07, 0.05), 0.015));
    d = min(d, sdRBox(l - vec3(0.0, 0.55, 0.0), vec3(1.12, 0.04, 0.025), 0.012));
    // the ledge the board rests on, with a small lip
    d = min(d, sdRBox(l - vec3(0.0, 0.99, 0.2), vec3(1.4, 0.055, 0.2), 0.012));
    d = min(d, sdRBox(l - vec3(0.0, 1.1, 0.4), vec3(1.4, 0.035, 0.022), 0.01));
    // the rear leg
    d = min(d, sdCapsule(p, REAR_TOP, REAR_FOOT, 0.042));
    d = min(d, sdRBox(l - vec3(0.0, 2.92, -0.07), vec3(0.09, 0.09, 0.07), 0.015));
    return d;
}

float board(vec3 p) {
    vec3 l = easelSpace(p) - vec3(0.0, BOARD_Y, 0.075);
    float bound = sdBox(l, vec3(BOARD.x + 0.1, BOARD.y + 0.1, 0.1));
    if (bound > 0.35) return bound;
    return sdRBox(l, vec3(BOARD, 0.025), 0.01);
}

vec2 map(vec3 p) {
    vec2 r = vec2(p.y, M_FLOOR);
    r = U(r, vec2(easel(p), M_OAK));
    return U(r, vec2(board(p), M_FOAM));
}

`;

        const MATERIALS = `
// ---- light
const vec3 KEY = normalize(vec3(-0.55, 1.35, 0.62));
const vec3 RIM = normalize(vec3(0.9, 0.5, -0.6));

// the backdrop, in display colours: pale mint, lighter up top
vec3 backdrop(vec2 uv) {
    return mix(vec3(0.80, 0.915, 0.85), vec3(0.95, 0.985, 0.96), smoothstep(-0.9, 0.7, uv.y));
}

vec3 env(vec3 r) {
    vec3 sky = mix(vec3(0.7, 0.84, 0.76), vec3(1.0), smoothstep(0.0, 0.8, r.y));
    vec3 c = mix(vec3(0.4, 0.42, 0.38), sky, smoothstep(-0.15, 0.1, r.y));
    c += vec3(5.0, 4.7, 4.3) * smoothstep(0.9, 0.97, dot(r, KEY));
    c += vec3(1.6, 1.8, 1.9) * smoothstep(0.88, 0.95, dot(r, RIM));
    return c;
}

vec3 woodColor(vec3 p, vec3 n) {
    // light oak, its figure running along each part
    vec3 q = abs(n.x) > 0.5 ? p.zyx : p;
    float g = noise3(q * vec3(0.8, 24.0, 24.0)) * 0.6 + noise3(q * vec3(2.5, 64.0, 64.0)) * 0.4;
    float rings = sin(q.y * 34.0 + q.z * 8.0 + g * 6.0) * 0.5 + 0.5;
    return mix(vec3(0.3, 0.15, 0.055), vec3(0.58, 0.33, 0.14), 0.35 + 0.45 * rings * g + 0.2 * g);
}

vec3 shade(vec3 ro, vec3 rd, vec2 uv, float jitter) {
    vec2 h = march(ro, rd);
    vec3 bg = backdrop(uv);
    if (h.x < 0.0) return bg;
    vec3 p = ro + rd * h.x;
    float m = h.y;
    vec3 n = normal(p);
    float occ = ao(p, n);
    float sh = softShadow(p + n * 0.002, KEY, 6.0, jitter);
    float facing = abs(dot(n, rd));

    if (m == M_FLOOR) {
        // a shadow catcher: the backdrop, darkened where the easel shades it
        float k = mix(0.68, 1.0, sh) * mix(0.6, 1.0, occ);
        return mix(bg * mix(vec3(0.6, 0.75, 0.67), vec3(1.0), k), bg, smoothstep(9.0, 22.0, h.x));
    }

    vec3 alb, f0 = vec3(0.04);
    float rough = 0.5, wrap = 0.0;
    if (m == M_OAK) {
        alb = woodColor(p, n);
        rough = 0.42;
    } else {
        // the foam board: white edges, the poster on its face
        vec3 l = easelSpace(p);
        vec3 nl = n;
        nl.yz = rot(-TILT) * nl.yz;
        alb = vec3(0.85, 0.855, 0.84);
        rough = 0.7;
        wrap = 0.2;
        if (nl.z > 0.7 && l.z > 0.095) {
            vec2 u = vec2(l.x / (2.0 * BOARD.x) + 0.5, 0.5 - (l.y - BOARD_Y) / (2.0 * BOARD.y));
            vec4 t = atlas(${glslRect(POSTER)}, u, lodAt(h.x, facing, 680.0));
            alb = mix(alb, pow(t.rgb, vec3(2.2)), t.a);
            rough = 0.55;
        }
    }

    // a warm key with soft shadows, a cool sky, a strip light behind on the
    // right and a little bounce off the floor
    float dif = clamp((dot(n, KEY) + wrap) / (1.0 + wrap), 0.0, 1.0) * sh;
    float sky = (0.6 + 0.4 * n.y) * occ;
    float rim = clamp(dot(n, RIM), 0.0, 1.0) * occ;
    float bounce = clamp(-n.y, 0.0, 1.0) * occ;
    vec3 light = vec3(2.7, 2.5, 2.25) * dif + vec3(0.56, 0.62, 0.62) * sky + vec3(0.55, 0.65, 0.65) * rim + vec3(0.3, 0.32, 0.28) * bounce;
    vec3 col = alb * light;

    // reflections of the studio, blurrier and dimmer off rougher surfaces
    vec3 r = reflect(rd, n);
    float fres = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
    vec3 F = f0 + (1.0 - f0) * fres;
    float gloss = 1.0 - rough;
    col += F * env(r) * mix(0.25, 1.0, gloss * gloss) * mix(0.35, 1.0, sh) * occ * gloss * 0.9;
    vec3 hv = normalize(KEY - rd);
    float spec = pow(clamp(dot(n, hv), 0.0, 1.0), mix(8.0, 180.0, gloss * gloss)) * gloss * gloss;
    col += F * spec * sh * vec3(2.4, 2.25, 2.0);

    return toDisplay(col);
}

`;

        runStudio({
            frag: studioShader({ geometry: GEOMETRY, materials: MATERIALS, atlasSize: ATLAS }),
            view: VIEW,
            atlas: makeAtlas,
            title: ctx => studioTitle(ctx, { label: 'WEBSITE', lines: ['Better', 'Poster'], pill: '#1fa65a' }),
        });
    </script>
</body>
</html>
