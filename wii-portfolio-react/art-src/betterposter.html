<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BetterPoster art</title>
    <style>
        @font-face { font-family: 'Rodin'; src: url('../public/fonts/FOT-Rodin%20Pro%20B.otf'); }
        html, body { margin: 0; background: transparent; overflow: hidden; }
        svg { display: block; }
    </style>
</head>
<body>
    <svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
    <script src="lib.js"></script>
    <script>
        const INK = '#173a2a';

        function qr(parent, x, y, size) {
            const n = 21, m = size / (n + 2);
            const rand = rng(42);
            const g = el('g', { transform: `translate(${x} ${y})` }, parent);
            el('rect', { width: size, height: size, rx: 6, fill: '#fff' }, g);
            const finder = (cx, cy) => (c, r) => c >= cx && c < cx + 7 && r >= cy && r < cy + 7;
            const finders = [finder(0, 0), finder(n - 7, 0), finder(0, n - 7)];
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    if (finders.some(f => f(c, r)) || (c < 8 && r < 8) || (c > n - 9 && r < 8) || (c < 8 && r > n - 9)) continue;
                    if (rand() > 0.52) el('rect', { x: (c + 1) * m, y: (r + 1) * m, width: m + 0.4, height: m + 0.4, fill: INK }, g);
                }
            }
            [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([c, r]) => {
                el('rect', { x: (c + 1) * m, y: (r + 1) * m, width: 7 * m, height: 7 * m, fill: INK }, g);
                el('rect', { x: (c + 2) * m, y: (r + 2) * m, width: 5 * m, height: 5 * m, fill: '#fff' }, g);
                el('rect', { x: (c + 3) * m, y: (r + 3) * m, width: 3 * m, height: 3 * m, fill: INK }, g);
            });
        }

        // A #betterposter: skinny side columns, the plain-language finding
        // huge in the green middle, QR code for the full paper.
        function poster(parent, defs, { x, y, scale = 1, rotate = 0 }) {
            const Wp = 820, Hp = 540;
            const g = el('g', { transform: `translate(${x} ${y}) rotate(${rotate}) scale(${scale}) translate(${-Wp / 2} 0)` }, parent);
            el('rect', { x: -6, y: -6, width: Wp + 12, height: Hp + 12, rx: 18, fill: INK, filter: 'url(#posterShadow)' }, g);
            el('rect', { width: Wp, height: Hp, rx: 13, fill: '#fdfcf7' }, g);

            // left column: title, authors, sections
            [[190, '#23332b'], [172, '#23332b'], [118, '#23332b']].forEach(([w, c], i) =>
                el('rect', { x: 22, y: 26 + i * 26, width: w, height: 16, rx: 8, fill: c }, g));
            el('rect', { x: 22, y: 112, width: 150, height: 10, rx: 5, fill: '#8aa39a' }, g);
            el('rect', { x: 22, y: 130, width: 110, height: 10, rx: 5, fill: '#8aa39a' }, g);
            for (let s = 0; s < 3; s++) {
                const sy = 170 + s * 120;
                el('rect', { x: 22, y: sy, width: 92, height: 13, rx: 6, fill: '#1d9a55' }, g);
                [196, 180, 190, 150, 170].forEach((w, i) =>
                    el('rect', { x: 22, y: sy + 26 + i * 16, width: w, height: 8, rx: 4, fill: '#c9d3cd' }, g));
            }

            // centre: the one finding, in plain English
            el('rect', { x: 246, y: 18, width: 328, height: Hp - 36, rx: 10, fill: 'url(#posterGreen)' }, g);
            const lines = [['Say the', '#fff'], ['main finding', '#ffe066'], ['in plain', '#fff'], ['English.', '#fff']];
            lines.forEach(([t, c], i) => el('text', {
                x: 272, y: 92 + i * 52, 'font-family': 'Rubik', 'font-weight': 700, 'font-size': 40, fill: c, text: t,
            }, g));
            [250, 230, 180].forEach((w, i) =>
                el('rect', { x: 272, y: 296 + i * 18, width: w, height: 8, rx: 4, fill: '#fff', opacity: 0.45 }, g));
            qr(g, 272, 386, 108);
            el('text', { x: 398, y: 432, 'font-family': 'Rodin', 'font-size': 17, fill: '#fff', text: 'Scan for the' }, g);
            el('text', { x: 398, y: 456, 'font-family': 'Rodin', 'font-size': 17, fill: '#fff', text: 'full paper' }, g);

            // right column: the "ammo bar" of figures
            const cx = 594;
            el('rect', { x: cx, y: 22, width: 204, height: 170, rx: 8, fill: '#eef4ef' }, g);
            [[62, '#9fdcae'], [88, '#6cc98a'], [118, '#3fb56b'], [148, '#1d9a55']].forEach(([h, c], i) =>
                el('rect', { x: cx + 22 + i * 44, y: 176 - h, width: 30, height: h, rx: 5, fill: c }, g));
            el('line', { x1: cx + 14, y1: 177, x2: cx + 192, y2: 177, stroke: '#23332b', 'stroke-width': 3 }, g);
            el('rect', { x: cx, y: 210, width: 204, height: 130, rx: 8, fill: '#eef4ef' }, g);
            el('polyline', {
                points: `${cx + 18},318 ${cx + 60},290 ${cx + 100},300 ${cx + 140},252 ${cx + 186},232`,
                fill: 'none', stroke: '#f2a73b', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
            }, g);
            [[cx + 60, 290], [cx + 140, 252], [cx + 186, 232]].forEach(([px, py]) =>
                el('circle', { cx: px, cy: py, r: 7, fill: '#fff', stroke: '#f2a73b', 'stroke-width': 4 }, g));
            [190, 170, 184, 120, 160, 176].forEach((w, i) =>
                el('rect', { x: cx + 6, y: 366 + i * 18, width: w, height: 8, rx: 4, fill: '#c9d3cd' }, g));
            el('rect', { width: Wp, height: Hp, rx: 13, fill: 'none', stroke: INK, 'stroke-width': 6 }, g);
            return g;
        }

        function easel(parent, { x, top, bottom, spread, ledgeY, ledgeW, back }) {
            const g = el('g', {}, parent);
            const wood = (x1, y1, x2, y2, w, color) => {
                el('line', { x1, y1, x2, y2, stroke: '#4a2c12', 'stroke-width': w + 10, 'stroke-linecap': 'round' }, g);
                el('line', { x1, y1, x2, y2, stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, g);
            };
            if (back) wood(x, top + 20, x, bottom + 10, 20, '#9a6230');
            wood(x - 18, top, x - spread, bottom, 26, '#c98a4b');
            wood(x + 18, top, x + spread, bottom, 26, '#c98a4b');
            return (board) => {
                // ledge goes in front of the board
                el('rect', { x: x - ledgeW / 2, y: ledgeY, width: ledgeW, height: 30, rx: 8, fill: '#c98a4b', stroke: '#4a2c12', 'stroke-width': 6 }, board);
                el('rect', { x: x - ledgeW / 2 + 10, y: ledgeY + 6, width: ledgeW - 20, height: 7, rx: 3, fill: '#fff', opacity: 0.3 }, board);
            };
        }

        function badge(parent, { x, y, r, rotate, icon }) {
            const g = sticker(parent, { x, y, r, rotate, fill: 'url(#badgeFill)', ring: '#178a4b', ringW: 10, shadow: 'rgba(10,60,30,0.3)', gloss: 0.6 });
            icon(g, r);
        }

        function stopwatch(g, r) {
            const s = r / 70;
            el('rect', { x: -10 * s, y: -52 * s, width: 20 * s, height: 16 * s, rx: 4 * s, fill: INK }, g);
            el('circle', { cy: -8 * s, r: 30 * s, fill: '#fff', stroke: INK, 'stroke-width': 7 * s }, g);
            el('path', { d: `M0,${-8 * s} L0,${-30 * s} A${22 * s},${22 * s} 0 0 1 ${19 * s},${-19 * s} Z`, fill: '#5fd48a' }, g);
            el('line', { x1: 0, y1: -8 * s, x2: 0, y2: -30 * s, stroke: INK, 'stroke-width': 5 * s, 'stroke-linecap': 'round' }, g);
            el('text', { y: 50 * s, 'text-anchor': 'middle', 'font-family': 'Rubik', 'font-weight': 700, 'font-size': 26 * s, fill: INK, text: '5 SEC' }, g);
        }

        function eye(g, r) {
            const s = r / 70;
            el('path', { d: `M${-44 * s},0 Q0,${-40 * s} ${44 * s},0 Q0,${40 * s} ${-44 * s},0Z`, fill: '#fff', stroke: INK, 'stroke-width': 6 * s, 'stroke-linejoin': 'round' }, g);
            el('circle', { r: 17 * s, fill: '#1d9a55', stroke: INK, 'stroke-width': 4 * s }, g);
            el('circle', { r: 7 * s, fill: INK }, g);
            el('circle', { cx: 6 * s, cy: -6 * s, r: 4 * s, fill: '#fff' }, g);
            [[-30, -30], [0, -40], [30, -30]].forEach(([dx, dy]) =>
                el('line', { x1: dx * s * 1.2, y1: dy * s * 1.2, x2: dx * s * 1.38, y2: dy * s * 1.38, stroke: INK, 'stroke-width': 5 * s, 'stroke-linecap': 'round' }, g));
        }

        function hills(parent, defs, scaleX, scaleY, offsetY) {
            const p = (d) => d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (_, a, b) => `${a * scaleX},${b * scaleY + offsetY}`);
            el('path', { d: p('M0,880 C400,800 800,850 1150,880 S1700,810 1920,790 L1920,1080 L0,1080Z'), fill: '#a6e39c' }, parent);
            return () => {
                el('path', { d: p('M0,965 C420,880 900,930 1300,955 S1760,905 1920,915 L1920,1080 L0,1080Z'), fill: 'url(#grass)', stroke: '#2f8f4a', 'stroke-width': 4 }, parent);
            };
        }

        function background(bg, defs) {
            el('rect', { width: W, height: H, fill: radial(defs, 'bgGrad', [[0, '#fffbe6'], [0.35, '#e8f8d8'], [0.75, '#a3dfb2'], [1, '#5cba7e']], { cx: '65%', cy: '52%', r: '80%' }) }, bg);
            const cx = 1255, cy = 560, R = 2400, n = 26;
            for (let i = 0; i < n; i++) {
                const a1 = (i / n) * Math.PI * 2, a2 = ((i + 0.5) / n) * Math.PI * 2;
                el('path', { d: `M${cx},${cy} L${cx + Math.cos(a1) * R},${cy + Math.sin(a1) * R} L${cx + Math.cos(a2) * R},${cy + Math.sin(a2) * R}Z`, fill: '#fff', opacity: 0.26 }, bg);
            }
            const pat = el('pattern', { id: 'dots', width: 26, height: 26, patternUnits: 'userSpaceOnUse' }, defs);
            el('circle', { cx: 13, cy: 13, r: 4, fill: '#1d9a55' }, pat);
            el('rect', { width: W, height: H, fill: 'url(#dots)', opacity: 0.12, mask: 'url(#dotMask)' }, bg);
            const mask = el('mask', { id: 'dotMask' }, defs);
            el('rect', { width: W, height: H, fill: radial(defs, 'dotFade', [[0.45, '#fff', 0], [1, '#fff', 1]], { cx: '65%', cy: '50%', r: '70%' }) }, mask);
        }

        function confetti(parent, seed, count, box) {
            const rand = rng(seed);
            const colors = ['#ffd23f', '#1d9a55', '#ff8a5b', '#6fcaf2', '#fff'];
            for (let i = 0; i < count; i++) {
                const x = box[0] + rand() * (box[2] - box[0]), y = box[1] + rand() * (box[3] - box[1]);
                el('rect', {
                    x: -9, y: -4, width: 18, height: 8, rx: 3, fill: colors[i % colors.length], stroke: INK, 'stroke-width': 2,
                    transform: `translate(${x} ${y}) rotate(${rand() * 180})`,
                }, parent);
            }
        }

        (async () => {
            await ready();
            const { defs, bg, fg } = setupSvg();
            linear(defs, 'posterGreen', [[0, '#27b066'], [1, '#148546']]);
            linear(defs, 'ribbonFill', [[0, '#2fbf6c'], [1, '#158a48']]);
            linear(defs, 'grass', [[0, '#7ad97b'], [1, '#3aa857']]);
            radial(defs, 'badgeFill', [[0, '#ffffff'], [1, '#e3f6e8']], { cx: '50%', cy: '35%', r: '70%' });
            shadowFilter(defs, 'posterShadow', { dy: 18, std: 16, color: '#0b3a1e', opacity: 0.35 });
            const hash = linear(defs, 'hashFill', [[0, '#fff29a'], [1, '#ffbf1f']]);
            const better = linear(defs, 'betterFill', [[0, '#ffffff'], [1, '#cdf3d9']]);
            const posterFill = linear(defs, 'posterWord', [[0, '#8df2b0'], [0.55, '#34c774'], [1, '#169a50']]);
            const titleStyle = { outline: '#0d4a2a', shadow: 'rgba(10,70,30,0.35)', anchor: 'middle' };

            if (TILE) {
                const front = hills(fg, defs, 1280 / 1920, 720 / 1080, 0);
                const ledge = easel(fg, { x: 945, top: 170, bottom: 700, spread: 150, ledgeY: 488, ledgeW: 360, back: true });
                poster(fg, defs, { x: 945, y: 130, scale: 0.64, rotate: 2 });
                ledge(fg);
                front();
                badge(fg, { x: 1180, y: 150, r: 58, rotate: 12, icon: stopwatch });
                logo(fg, defs, { ...titleStyle, x: 338, y: 258, size: 150, spans: [{ text: '#', fill: hash }, { text: 'Better', fill: better }] });
                logo(fg, defs, { ...titleStyle, x: 338, y: 420, size: 150, spans: [{ text: 'Poster', fill: posterFill }] });
                badge(fg, { x: 150, y: 588, r: 50, rotate: -10, icon: eye });
                confetti(fg, 3, 7, [470, 480, 640, 640]);
                [[80, 110, 20], [590, 90, 16], [1240, 330, 14], [640, 560, 12]].forEach(([x, y, r]) => sparkle(fg, x, y, r, '#fff', 0.95));
            } else {
                background(bg, defs);
                const front = hills(fg, defs, 1, 1, 0);
                const ledge = easel(fg, { x: 1255, top: 340, bottom: 1040, spread: 225, ledgeY: 842, ledgeW: 540, back: true });
                poster(fg, defs, { x: 1255, y: 300, scale: 1 });
                ledge(fg);
                front();
                badge(fg, { x: 1650, y: 300, r: 74, rotate: 12, icon: stopwatch });
                logo(fg, defs, { ...titleStyle, x: 470, y: 350, size: 188, spans: [{ text: '#', fill: hash }, { text: 'Better', fill: better }] });
                logo(fg, defs, { ...titleStyle, x: 470, y: 548, size: 188, spans: [{ text: 'Poster', fill: posterFill }] });
                ribbon(fg, { x: 470, y: 668, text: 'Evidence-based poster templates', size: 30, fill: 'url(#ribbonFill)', tail: '#0f6b38', ink: INK });
                badge(fg, { x: 250, y: 850, r: 66, rotate: -10, icon: eye });
                confetti(fg, 3, 12, [560, 760, 860, 900]);
                confetti(fg, 9, 6, [1720, 440, 1860, 760]);
                [[140, 170, 26], [790, 150, 22], [1810, 230, 18], [880, 470, 14], [1760, 800, 16], [640, 820, 12]].forEach(([x, y, r]) => sparkle(fg, x, y, r, '#fff', 0.95));
            }
            document.body.dataset.done = '1';
        })();
    </script>
</body>
</html>
